<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F8F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Ferrowarden{% endblock %} - Ferrowarden</title>
<link rel="icon" href="/ui/static/favicon.ico" sizes="any">
<link rel="icon" href="/ui/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/ui/static/apple-touch-icon.png">
<link rel="stylesheet" href="{{ css_path }}">
</head>
<body>
{% block header %}<header class="top">
<div class="top-inner">
<a class="brand" href="/ui/">{% include "ui/_mark.html" %}<span>Ferrowarden</span><span class="sub">Admin</span></a>
{% if let Some(nav) = nav %}
<nav class="mainnav" aria-label="Main">
<a href="/ui/"{% if nav.current == "status" %} aria-current="page"{% endif %}>Status</a>
<a href="/ui/keys"{% if nav.current == "keys" %} aria-current="page"{% endif %}>Keys</a>
<a href="/ui/audit"{% if nav.current == "audit" %} aria-current="page"{% endif %}>Audit</a>
</nav>
<div class="acct">
<span class="account" title="{{ nav.account_email }}">{{ nav.account_email }}</span>
<form method="post" action="/ui/logout" class="signout">
<input type="hidden" name="csrf" value="{{ nav.csrf }}">
<button type="submit" class="secondary">Sign out</button>
</form>
</div>
{% endif %}
</div>
</header>{% endblock %}
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
