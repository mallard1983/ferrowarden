# docker-compose.test.yml
#
# Full self-contained test stack. Extends the production stack with:
#   - vault-setup: one-shot account creation (no manual web UI steps)
#   - vault-seeder: seeds test credentials (runs after vault-setup)
#   - mock-api: captures forwarded requests so tests can inspect them
#
# Usage:
#   # First run (fresh environment):
#   scripts/dev-setup.sh
#
#   # Subsequent runs (data already exists):
#   docker compose -f docker-compose.test.yml up -d
#
#   # Run integration tests:
#   cargo test --test integration
#
# All test credentials and passwords are intentionally weak/fake.
# This compose file must NEVER be used in production.

services:

  # ── Internal PKI (one-shot) ──────────────────────────────────────────────────
  # Creates a private CA and a certificate for "vaultwarden" in the
  # internal-pki volume. Vaultwarden serves HTTPS on the internal network, and
  # Ferrowarden and the setup containers trust this CA. Idempotent: re-issues the server cert only when missing or
  # expiring. Runs `ferrowarden internal-certs` from the Ferrowarden image
  # (docker-compose.yml explains the user and hardening).
  internal-certs:
    image: ferrowarden:test
    build: .
    entrypoint: ["/app/ferrowarden", "internal-certs"]
    user: "0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - internal-pki:/pki
      # Receives a copy of ca.crt only (never the key), for ferrowarden.
      - internal-ca-public:/ca-public
    environment:
      VW_HOSTNAME: "vaultwarden"
    restart: "no"

  # ── Vaultwarden (test override) ──────────────────────────────────────────────
  # Allow signups during the initial setup run. The dev-setup script disables
  # this after account creation.
  vaultwarden:
    # Pinned: the suite is verified against this release. Upgrade
    # deliberately and re-run the tests. VAULTWARDEN_VERSION selects another
    # release: CI runs the whole suite against the previous minor (1.36.0)
    # with an Argon2id account (TEST_KDF=argon2id). See docs/cicd.md.
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-1.37.5}
    restart: unless-stopped
    # Same as production: the only hardening Vaultwarden gets (it binds 443 as root).
    security_opt:
      - "no-new-privileges:true"
    environment:
      DOMAIN: "https://vaultwarden"
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      # HTTPS on the internal network, using the internal CA's certificate,
      # as in production (docs/tls.md).
      ROCKET_TLS: '{certs="/pki/vaultwarden.crt",key="/pki/vaultwarden.key"}'
      ROCKET_PORT: "443"
    volumes:
      - vaultwarden-test-data:/data
      - internal-pki:/pki:ro
    depends_on:
      internal-certs:
        condition: service_completed_successfully
    networks:
      - vault-internal

  # ── Ferrowarden ─────────────────────────────────────────────────────────────
  # Reads the vault itself (the native backend, docs/native-vault.md), with the
  # Vaultwarden API key from the setup run.
  #   ports 3000 (API), 3001 (admin UI) and 9095 (metrics)
  ferrowarden:
    image: ferrowarden:test
    build: .
    restart: unless-stopped
    # Hardened exactly like production (docker-compose.yml): scratch image,
    # read-only root filesystem, no capabilities, no privilege escalation.
    # Writable paths, all on the volume below: /data/agent_keys.json (and its
    # .tmp sibling) and the event file under /data/events.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: 1g
    secrets:
      - ferrowarden_admin_key
      - bw_master_password
      - bw_client_id
      - bw_client_secret
      - notify_webhook_token
      - metrics_token
    volumes:
      - ferrowarden-keys:/data
      # Public CA certificate only; the CA private key stays in internal-pki,
      # which ferrowarden must never mount.
      - internal-ca-public:/ca-public:ro
    environment:
      FERROWARDEN_VAULT__URL: "https://vaultwarden"
      FERROWARDEN_VAULT__CA_FILE: "/ca-public/ca.crt"
      FERROWARDEN_VAULT_CLIENT_ID_FILE: "/run/secrets/bw_client_id"
      FERROWARDEN_VAULT_CLIENT_SECRET_FILE: "/run/secrets/bw_client_secret"
      FERROWARDEN_UNLOCK_MODE: "file"
      FERROWARDEN_UNLOCK_FILE: "/run/secrets/bw_master_password"
      FERROWARDEN_BIND_ADDR: "0.0.0.0:3000"
      FERROWARDEN_ADMIN_KEY_FILE: "/run/secrets/ferrowarden_admin_key"
      FERROWARDEN_KEYS_FILE: "/data/agent_keys.json"
      # TLS is disabled in the test stack. All services share a Docker-internal
      # network on the same host - there is no network hop to protect.
      # Production deployments must use tls_enabled = true.
      FERROWARDEN_TLS_ENABLED: "false"
      # mock-api lives on a private Docker network; allow it explicitly.
      # notify-sink is the same container under its notifier alias. It is listed
      # on purpose: the notifier host is refused to agents by its own deny list,
      # whatever allowed_targets says, and the integration tests prove it.
      FERROWARDEN_ALLOWED_TARGETS: "mock-api,notify-sink"
      # Short refresh so tests see vault changes quickly.
      FERROWARDEN_REFRESH_INTERVAL_SECS: "30"
      # The integration suite fires all its requests from one IP within a
      # fraction of a second on fast CI runners; the default burst (20)
      # would turn later tests into 429s.
      FERROWARDEN_AGENT_RATE_LIMIT_BURST: "1000"
      # Same for the admin endpoints (default burst 5): the key lifecycle,
      # status and audit tests call them back-to-back.
      FERROWARDEN_ADMIN_RATE_LIMIT_BURST: "1000"
      # Also write security events to a file. The root filesystem is read-only,
      # so it goes on the ferrowarden-keys volume (not a bind mount, so this
      # works on Linux CI runners whose UID differs); scripts/check-no-secrets.sh
      # copies it out with `docker compose cp` and scans it for secret values.
      FERROWARDEN_EVENTS__FILE: "/data/events/events.jsonl"
      # Admin web UI, for the integration tests. The test client speaks plain
      # HTTP, hence insecure_http; never do this outside a test stack.
      FERROWARDEN_UI__BIND: "0.0.0.0:3001"
      FERROWARDEN_UI__INSECURE_HTTP: "true"
      FERROWARDEN_NOTIFY__WEBHOOK_URL: "http://notify-sink:7777/notify"
      FERROWARDEN_NOTIFY__ALLOW_HTTP: "true"
      FERROWARDEN_NOTIFY_WEBHOOK_TOKEN_FILE: "/run/secrets/notify_webhook_token"
      FERROWARDEN_NOTIFY__EVENTS: "blocked,auth_failure,vault,system"
      FERROWARDEN_NOTIFY__MIN_INTERVAL_SECS: "2"
      FERROWARDEN_NOTIFY__MAX_PER_HOUR: "100000"
      # Prometheus metrics (docs/metrics.md) on their own port, bearer token
      # from a test secret (secrets/metrics_token, on the secret gate's list).
      FERROWARDEN_METRICS__BIND: "0.0.0.0:9095"
      FERROWARDEN_METRICS_TOKEN_FILE: "/run/secrets/metrics_token"
    networks:
      - vault-internal
      - test-net
    ports:
      # Loopback only by default. To test through a reverse proxy on another
      # machine (e.g. Pangolin/newt), set FERROWARDEN_TEST_PUBLISH=0.0.0.0.
      - "${FERROWARDEN_TEST_PUBLISH:-127.0.0.1}:3000:3000"
      - "${FERROWARDEN_TEST_PUBLISH:-127.0.0.1}:3001:3001"
      # Metrics listener (token required).
      - "${FERROWARDEN_TEST_PUBLISH:-127.0.0.1}:9095:9095"
    depends_on:
      internal-certs:
        condition: service_completed_successfully
      vaultwarden:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/ferrowarden", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Mock API ─────────────────────────────────────────────────────────────────
  # Accepts any HTTP request, logs the full details (method, path, headers,
  # body), and exposes a query endpoint so integration tests can verify exactly
  # what Ferrowarden forwarded.
  #
  # Why this matters:
  #   The core security claim of Ferrowarden is that credential values are
  #   substituted before the outbound request and never reach the agent. This
  #   server is the observer that proves or disproves that claim in tests.
  #
  # Endpoints:
  #   GET  /__requests__       — all captured requests
  #   GET  /__requests__/last  — most recent request
  #   POST /__reset__          — clear the log (call between tests)
  #   GET  /__health__         — liveness check
  mock-api:
    build:
      context: ./tests/mock-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MOCK_API_PORT: "7777"
    networks:
      vault-internal:   # Ferrowarden forwards to it on the internal network
        aliases:
          # The notifier posts here. Same container, second name: the mock
          # keeps requests made under this name in a separate log.
          - notify-sink
      test-net: {}      # Tests query its log from the host
    ports:
      - "127.0.0.1:7777:7777"

  # ── Vault Setup (one-shot) ───────────────────────────────────────────────────
  # Registers the Vaultwarden account and creates an API key. Only needed on
  # the very first run (or after wiping test data). Idempotent: if the account
  # already exists, it re-derives the API key from the existing account.
  #
  # Run manually: docker compose -f docker-compose.test.yml run --rm vault-setup
  vault-setup:
    profiles: ["setup"]
    # Runs as the invoking user (dev-setup.sh exports HOST_UID/HOST_GID) so it
    # can write bw_client_id/bw_client_secret into the bind-mounted secrets/
    # directory on Linux hosts whose UID is not 1000 (e.g. CI runners).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ./docker
      dockerfile: setup.Dockerfile
    entrypoint: ["/bin/sh", "/setup-entrypoint.sh"]
    volumes:
      - ./docker/setup-entrypoint.sh:/setup-entrypoint.sh:ro
      - ./secrets:/secrets
      - internal-pki:/pki:ro
    environment:
      BW_SERVER_URL: "https://vaultwarden"
      SETUP_EMAIL: "${SETUP_EMAIL:-admin@ferrowarden.test}"
      SETUP_MASTER_PASSWORD: "${SETUP_MASTER_PASSWORD:-ferrowarden-test-master-pw}"
      # The KDF both accounts are registered with: pbkdf2 (default) or
      # argon2id (64 MiB, 3 iterations, parallelism 4). The seeders and the
      # API key script read it back from the server's prelogin.
      TEST_KDF: "${TEST_KDF:-pbkdf2}"
      # Owns the restricted organisation whose collection hides passwords
      # from SETUP_EMAIL (docker/bw-seed-hidden.js).
      HIDDEN_OWNER_EMAIL: "${HIDDEN_OWNER_EMAIL:-org-owner@ferrowarden.test}"
      SECRETS_DIR: "/secrets"
    networks:
      - vault-internal
    depends_on:
      - vaultwarden
    restart: "no"

  # ── Vault Seeder (one-shot) ──────────────────────────────────────────────────
  # Seeds test credentials into Vaultwarden. Idempotent — skips existing names.
  # Run after vault-setup on first run, or whenever credentials.json changes.
  #
  # Run manually: docker compose -f docker-compose.test.yml run --rm vault-seeder
  vault-seeder:
    profiles: ["setup"]
    build:
      context: ./docker
      dockerfile: setup.Dockerfile
    entrypoint: ["/bin/sh", "/seed-entrypoint.sh"]
    volumes:
      - ./docker/seed-entrypoint.sh:/seed-entrypoint.sh:ro
      - ./tests/seed/credentials.json:/seed/credentials.json:ro
      # The item whose collection hides passwords from the test account.
      - ./tests/seed/hidden.json:/seed/hidden.json:ro
      - internal-pki:/pki:ro
    secrets:
      - bw_master_password
    environment:
      BW_SERVER_URL: "https://vaultwarden"
      SETUP_EMAIL: "${SETUP_EMAIL:-admin@ferrowarden.test}"
      HIDDEN_OWNER_EMAIL: "${HIDDEN_OWNER_EMAIL:-org-owner@ferrowarden.test}"
    networks:
      - vault-internal
    depends_on:
      - vaultwarden
    restart: "no"


networks:
  vault-internal:
    driver: bridge
    internal: true
  test-net:
    driver: bridge

volumes:
  vaultwarden-test-data:
  internal-pki:
  # Public CA certificate only (see internal-certs); mounted into ferrowarden.
  internal-ca-public:
  ferrowarden-keys:

secrets:
  bw_client_id:
    file: ./secrets/bw_client_id
  bw_client_secret:
    file: ./secrets/bw_client_secret
  bw_master_password:
    file: ./secrets/bw_master_password
  ferrowarden_admin_key:
    file: ./secrets/ferrowarden_admin_key
  # Bearer token Ferrowarden's notifier sends to the mock's notification sink.
  # A test value generated by scripts/dev-setup.*; never reuse it elsewhere.
  notify_webhook_token:
    file: ./secrets/notify_webhook_token
  # Bearer token of the metrics listener (docs/metrics.md). A test value
  # generated by scripts/dev-setup.*; never reuse it elsewhere.
  metrics_token:
    file: ./secrets/metrics_token
