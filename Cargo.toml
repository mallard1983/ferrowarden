[package]
name = "ferrowarden"
version = "0.2.0"
edition = "2021"
description = "A credential proxy for AI agents — substitutes Vaultwarden secrets into API calls without exposing values to the agent"
license = "FSL-1.1-ALv2"
repository = "https://github.com/mallard1983/ferrowarden"
readme = "README.md"
keywords = ["vaultwarden", "bitwarden", "credentials", "proxy", "ai-agents"]
categories = ["web-programming::http-server", "authentication"]

# Two binaries: the proxy and the MCP bridge for agent harnesses (docs/mcp.md).
# The bridge is a thin HTTP client of a running Ferrowarden; it never starts
# the proxy or reads vault state.
[[bin]]
name = "ferrowarden"
path = "src/main.rs"

[[bin]]
name = "ferrowarden-mcp"
path = "src/bin/ferrowarden-mcp.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["json"] }

# TLS support via rustls (ring backend for easier cross-platform builds)
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }

# HTTP client (for forwarding requests and bw serve calls)
# rustls-tls: use rustls instead of native-tls/openssl — avoids OpenSSL build
# deps in Docker and aligns with the axum-server TLS backend choice.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Secret zeroing — wipes credential values from memory after use
zeroize = { version = "1", features = ["derive", "serde"] }

# Configuration
config = "0.15"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# UUID: v4 for agent key ids, v7 (time-ordered) for per-request IDs
uuid = { version = "1", features = ["v4", "v5", "v7"] }

# Regex for response credential pattern scanning
regex = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Secure random number generation (for key generation)
rand = "0.10"

# SHA-256 for token hashing in the key store (tokens are stored as hashes, never plaintext)
sha2 = "0.11"

# URL encoding for vault item lookups and response scrubbing variants
urlencoding = "2"

# Base64 encoding: scrubbing base64-encoded credential echoes and returning
# non-UTF-8 response bodies to the agent
base64 = "0.23"

# Per-IP token bucket rate limiting. Keyed limiter maps source IP → token bucket.
# Using 0.6 — verify compatibility before upgrading to 0.7+ (breaking API changes possible).
governor = "0.10"

# Syslog-over-TLS event sink: the same rustls (ring) stack that axum-server and
# reqwest already use, with the webpki root store plus an optional operator CA.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

# ── Admin web UI (docs/admin-ui.md) ───────────────────────────────────────────
# Vaultwarden login key derivation: PBKDF2-HMAC-SHA256 (matches sha2 0.11 above)
# and Argon2id. `zeroize` wipes the Argon2 memory blocks and the HMAC state.
pbkdf2 = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
argon2 = { version = "0.6", features = ["zeroize"] }
# Server-rendered pages with auto-escaping (templates/ui/*.html).
askama = "0.16"
# Constant-time comparison of CSRF tokens.
subtle = "2"
# Session ids and CSRF tokens come straight from the operating system's RNG.
getrandom = "0.4"
# application/x-www-form-urlencoded encoding of the token request.
form_urlencoded = "1"
# Reads request bodies frame by frame, so the password lands in a buffer we
# own and can zeroize.
http-body-util = "0.1"

# ── Native vault backend (docs/native-vault.md) ───────────────────────────────
# Bitwarden client cryptography implemented from the published algorithm
# descriptions with RustCrypto primitives (MIT OR Apache-2.0). No Bitwarden SDK
# crate is used or linked: those are GPL-3.0 / Bitwarden SDK Licence.
# AES-256-CBC (EncString type 2) with PKCS#7 padding; the MAC is HMAC-SHA256 (`hmac` above).
# The `zeroize` features wipe the expanded AES key and the CBC state on drop.
aes = { version = "0.9", features = ["zeroize"] }
cbc = { version = "0.2", features = ["block-padding", "zeroize"] }
# HKDF-Expand: the master key is stretched into the `enc` and `mac` keys.
hkdf = "0.13"
# RSA-OAEP (SHA-1 / SHA-256) for organisation keys. 0.10 or later only: earlier
# releases carry RUSTSEC-2023-0071 (Marvin timing side channel).
rsa = "0.10"
sha1 = "0.11"

# ── OpenAPI description (docs/openapi.yaml) ───────────────────────────────────
# The hand-written spec is embedded in the binary and parsed once at startup.
# serde_norway is the maintained fork of the archived serde_yaml (same API);
# no other YAML crate is used.
serde_norway = "0.9"

# ── MCP bridge (ferrowarden-mcp, docs/mcp.md) ─────────────────────────────────
# Official MCP Rust SDK: server side, stdio transport only (no HTTP transports,
# no macros, no OAuth). The tool schemas are written out in src/mcp/tools.rs and
# tested against docs/openapi.yaml.
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }

# ── Prometheus metrics (docs/metrics.md) ──────────────────────────────────────
# The official Prometheus client for Rust (Apache-2.0 OR MIT). Pure Rust with
# no active build script (the protobuf build step belongs to an optional
# feature we leave off), so it builds for the static musl target like the
# rest. Output is the OpenMetrics text format. Its small dependencies (dtoa,
# itoa, parking_lot) are MIT and/or Apache-2.0 as well.
prometheus-client = "0.26"

# ── Internal PKI (ferrowarden internal-certs, docs/tls.md) ─────────────────────
# rcgen (MIT OR Apache-2.0) issues the CA and Vaultwarden certificates with the
# ring backend (no aws-lc). rustls-webpki (ISC) is already in the tree through
# rustls; it decides whether an existing certificate is still good.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls-webpki = { version = "0.103.17", default-features = false, features = ["ring", "std"] }
# Calendar arithmetic for certificate validity (already in the tree through rcgen).
time = { version = "0.3", default-features = false }

# Process hardening of the native vault backend (PR_SET_DUMPABLE, RLIMIT_CORE).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The MCP bridge tests drive the server with rmcp's own client over an
# in-memory stream (client side is not compiled into the release binary).
rmcp = { version = "3.11", default-features = false, features = ["server", "client", "transport-io"] }
tempfile = "3"
# Router tests drive the axum app in-process with tower's `oneshot`.
tower = { version = "0.5", features = ["util"] }
# Integration tests validate real responses against docs/openapi.yaml. No HTTP
# or file `$ref` resolvers and no TLS stack: the spec is one local document.
jsonschema = { version = "0.63", default-features = false }
# Reads the issued certificates back in the internal-certs tests (extensions, validity).
x509-parser = "0.18.1"
