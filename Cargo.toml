[package]
name = "ferrowarden"
version = "0.1.0"
edition = "2021"
description = "A credential proxy for AI agents — substitutes Vaultwarden secrets into API calls without exposing values to the agent"
license = "MIT"
repository = "https://github.com/yourusername/ferrowarden"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["json"] }

# HTTP client (for forwarding requests and bw serve calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Secret zeroing — wipes credential values from memory after use
zeroize = { version = "1", features = ["derive"] }

# Configuration
config = "0.14"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# UUID for agent key generation
uuid = { version = "1", features = ["v4"] }

# Regex for response credential pattern scanning
regex = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Secure random number generation (for key generation)
rand = "0.9"

# URL encoding for vault item name lookups
urlencoding = "2"

[dev-dependencies]
tokio-test = "0.4"
