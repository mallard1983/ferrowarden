# Minimal single-binary Loki for trying the Ferrowarden examples. Not tuned for production.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /etc/loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true

# Alert rules in ./rules/<tenant>/*.yaml (tenant is "fake" when auth is disabled).
# Point alertmanager_url at your Alertmanager to receive the alerts.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  enable_api: true

analytics:
  reporting_enabled: false
