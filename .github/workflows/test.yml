# .github/workflows/test.yml
#
# Runs on github.com/mallard1983/ferrowarden: formatting, clippy and unit
# tests on every push; the full Docker integration suite on pushes to the
# default branch and on pull requests. See docs/cicd.md.
#
# Actions are pinned to commit SHAs (version in the comment); Dependabot
# keeps them current.

name: Test

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  # ── Unit tests and lints ─────────────────────────────────────────────────────
  # Runs on every push. No Docker required.
  # --bins: ferrowarden is a binary crate (no lib target), so `--lib` fails.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --bins

      # docs/openapi.yaml is hand-written. Lint it with the recommended
      # Redocly ruleset (redocly.yaml). The CLI is pinned to an exact version;
      # npx and Node come with the ubuntu runner image.
      - name: Lint the OpenAPI specification
        run: npx --yes @redocly/cli@2.83.0 lint docs/openapi.yaml

  # ── Integration tests ─────────────────────────────────────────────────────────
  # Requires Docker Compose. Runs on pull requests and the default branch.
  #
  # Runs scripts/dev-setup.sh as the runner user (UID 1001): the test stack
  # handles non-1000 UIDs (see docker-compose.test.yml, vault-setup).
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only run on PRs and the default branch to save runner minutes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify Docker Compose available
        run: docker compose version

      - name: Clean up any previous run
        run: docker compose -f docker-compose.test.yml down -v 2>/dev/null || true

      - name: Run dev setup (starts full stack)
        run: |
          chmod +x scripts/dev-setup.sh
          scripts/dev-setup.sh

      # The test stack runs two Ferrowarden instances against one Vaultwarden
      # account (docs/native-vault.md): `ferrowarden` with bw serve (port 3000)
      # and `ferrowarden-native` with the native vault backend (port 3003).
      # FERROWARDEN_KEEP_GATE_SECRETS keeps the run-generated tokens of every
      # step below for the secret gate; the file is cleared once, here.
      - name: Run integration tests (bw serve backend)
        run: |
          rm -f target/integration-secrets.txt
          set -a; source .env.test; set +a
          export FERROWARDEN_KEEP_GATE_SECRETS=1
          cargo test --test integration -- --nocapture --test-threads=1

      # Equivalence of the two backends (tests/equivalence.rs): identical
      # credential listings, and every offered placeholder substitutes the same
      # value (or fails the same way) through both instances. Values are never
      # printed. The gate for ever making `native` the default backend.
      - name: Run the backend equivalence suite
        run: |
          set -a; source .env.test; set +a
          export FERROWARDEN_KEEP_GATE_SECRETS=1 FERROWARDEN_EQUIVALENCE_REQUIRED=1
          cargo test --test equivalence -- --nocapture --test-threads=1

      # The whole integration suite again, against the native instance. No test
      # is skipped: the container-hardening test inspects the `ferrowarden`
      # service whichever instance the suite targets (docs/cicd.md).
      - name: Run integration tests (native backend)
        run: |
          set -a; source .env.test.native; set +a
          export FERROWARDEN_KEEP_GATE_SECRETS=1
          cargo test --test integration -- --nocapture --test-threads=1

      # ferrowarden-mcp (docs/mcp.md): the real binary over stdio against the
      # same stack.
      - name: Run MCP integration tests
        run: |
          set -a; source .env.test; set +a
          cargo test --test mcp -- --nocapture --test-threads=1

      # Secret gate: no seeded secret value, agent key, admin key, master
      # password or Vaultwarden API key may appear in the logs or the security
      # event file of either Ferrowarden instance.
      - name: Check logs and events for secret values
        run: bash scripts/check-no-secrets.sh

      # The hardened container (docs/deployment-profiles.md): the admin key is
      # read from its secret file by the binary and never put in the process
      # environment. /proc/<pid>/environ of a container process is readable by
      # root on the host only, hence sudo. The key is compared with
      # `grep -qF -f` and never printed.
      # The native instance also holds the Vaultwarden API key: its environment
      # must name the secret files, never hold the values.
      - name: Check the admin key is not in the process environment
        run: |
          set -euo pipefail
          [ -s secrets/ferrowarden_admin_key ]
          for service in ferrowarden ferrowarden-native; do
            cid="$(docker compose -f docker-compose.test.yml ps -q "$service")"
            pid="$(docker inspect -f '{{.State.Pid}}' "$cid")"
            [ "$pid" -gt 0 ]
            env_file="$(mktemp)"
            sudo cat "/proc/$pid/environ" | tr '\0' '\n' > "$env_file"
            # Control: this really is ferrowarden's environment, and it names
            # the secret file (a path) instead of holding the secret.
            grep -q '^FERROWARDEN_ADMIN_KEY_FILE=/run/secrets/ferrowarden_admin_key$' "$env_file"
            if grep -qF -f secrets/ferrowarden_admin_key "$env_file"; then
              echo "the admin key is in the $service process environment" >&2
              exit 1
            fi
            if grep -q '^FERROWARDEN_ADMIN_KEY=' "$env_file"; then
              echo "FERROWARDEN_ADMIN_KEY is set in the $service process environment" >&2
              exit 1
            fi
            if [ "$service" = ferrowarden-native ]; then
              grep -q '^FERROWARDEN_VAULT_CLIENT_SECRET_FILE=/run/secrets/bw_client_secret$' "$env_file"
              for f in bw_client_id bw_client_secret bw_master_password; do
                if grep -qF -f "secrets/$f" "$env_file"; then
                  echo "$f is in the $service process environment" >&2
                  exit 1
                fi
              done
            fi
            rm -f "$env_file"
          done
          echo "OK: the process environments hold the paths of the secret files, not the secrets."

      # The image is the binary and the minimal passwd/group on scratch: no
      # shell, no package manager, no curl, and a static binary (it starts
      # with no dynamic loader or libc).
      - name: Check the image has no shell and nothing but the binary
        run: |
          set -euo pipefail
          cid="$(docker compose -f docker-compose.test.yml ps -q ferrowarden)"
          image="$(docker inspect -f '{{.Image}}' "$cid")"
          if docker run --rm --entrypoint /bin/sh "$image" -c true 2>/dev/null; then
            echo "the image contains /bin/sh" >&2
            exit 1
          fi
          docker run --rm --entrypoint /app/ferrowarden "$image" --version
          tmp="$(docker create "$image")"
          # Docker adds the mount points and network files at container
          # creation; anything else in the image is unexpected.
          unexpected="$(docker export "$tmp" | tar -t | grep -v -x -E '\.dockerenv|app/|app/ferrowarden|data/|dev/|dev/console|dev/pts/|dev/shm/|etc/|etc/group|etc/hostname|etc/hosts|etc/mtab|etc/passwd|etc/resolv\.conf|proc/|sys/' || true)"
          docker rm "$tmp" > /dev/null
          if [ -n "$unexpected" ]; then
            echo "unexpected files in the image:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo "OK: the image holds only the binary, passwd/group and /data."
          docker image inspect -f 'image size: {{.Size}} bytes' "$image"

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # TODO(#36): run the backend suites against the previous Vaultwarden minor
  # (VAULTWARDEN_VERSION=1.36.0 is a real tag and the seeder and the native
  # backend work against it), as a second job. Not done because the pinned
  # Bitwarden CLI (2026.11.0) cannot sync a 1.36.0 vault (its SDK rejects a
  # cipher the server sends), so the bw serve side of the equivalence suite
  # cannot run there. It needs either a CLI release that supports both servers
  # or a native-only setup mode in scripts/dev-setup.*. See docs/cicd.md.
