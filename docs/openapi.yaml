openapi: 3.1.0
info:
  title: Ferrowarden API
  version: 0.2.0
  summary: HTTP API of Ferrowarden, the credential boundary for AI agents.
  description: |
    Ferrowarden lets AI agents make API requests with named credentials without exposing credential values to the agent.

    An agent sends the request it wants to make, with `{{vault:name}}` placeholders wherever a credential belongs. Ferrowarden looks the credential up in the vault, substitutes the value, forwards the request, and returns the response with known credential values scrubbed. See the `ProxyRequest` schema for the placeholder grammar and `ProxyResponse` for what scrubbing covers and where it stops.

    Ferrowarden is a sidecar to Vaultwarden, not a fork or replacement vault. It is an independent project and is not affiliated with or endorsed by the Vaultwarden or Bitwarden projects.

    Operations are grouped by who calls them. Agent operations authenticate with an agent key (`X-Agent-Key`). Request bodies are parsed strictly: duplicate object keys, unknown fields, trailing data, a body nested deeper than 64 levels, and a content type other than `application/json` are rejected with `400`. The key is checked before the body or query string is read, so a request without a valid key gets `401` whatever it contains.
  license:
    name: Functional Source License, Version 1.1, ALv2 Future License
    identifier: FSL-1.1-ALv2
  contact:
    name: Ferrowarden on GitHub
    url: https://github.com/mallard1983/ferrowarden
externalDocs:
  description: Ferrowarden documentation
  url: https://github.com/mallard1983/ferrowarden/blob/main/docs/api-reference.md
servers:
  - url: /
    description: |
      The base URL of the Ferrowarden instance you are talking to. If the operator has set `api_prefix` (for example `/k7f3q9`), that prefix goes in front of every path in this document except `/health`. The copy served by `GET /v1/openapi.json` has this entry filled in.
tags:
  - name: agent
    description: Operations for AI agents. Authenticate with an agent key. Requests count against the per-IP agent rate limit.
  - name: admin
    description: "Operations for the operator. Authenticate with the admin key, in `X-Admin-Key` or as `Authorization: Bearer`. Requests count against the per-IP admin rate limit, which is stricter than the agent limit."
  - name: meta
    description: Health and API description.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Health check
      description: |
        Returns `200` while the HTTP server is accepting connections. It needs no key, is not rate limited, and is never moved under `api_prefix`. It does not report whether the vault is unlocked.
      security: []
      servers:
        - url: /
          description: Never prefixed, whatever `api_prefix` is set to.
      responses:
        "200":
          description: The server is up. The body is empty.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "405":
          description: The method is not GET. The answer is the framework's own and has an empty body. It is the only error this operation returns.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
  /v1/openapi.json:
    get:
      operationId: getOpenApiSpec
      tags: [meta]
      summary: Fetch this API description
      description: |
        Returns this OpenAPI document as JSON, with `servers[0].url` set to the configured `api_prefix` (or `/` when none is set), so a client can use it from the same base URL it fetched it from.

        The document describes the operations the presented key can call, so what you receive depends on the key. A request without a valid key gets `401`.

        Calls count against the agent rate limit, whichever key is used. The query string must be empty.
      security:
        - agentKey: []
        - adminKey: []
        - adminBearer: []
      parameters: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/credentials:
    get:
      operationId: listCredentials
      tags: [agent]
      summary: List the credentials this key may use
      description: |
        Lists the vault items (logins and secure notes) that the agent key's policy allows, by name. Credential values are not part of the response. This is how an agent finds out which names it can put in a `{{vault:name}}` placeholder.

        With `detail=true` each entry is an object with ready-made placeholders (copy them as they are rather than building your own), the hosts the credential is bound to, and the reason for anything that is unavailable. Credentials the key's policy does not allow are left out entirely. A key with `credentials: []` gets `[]`.

        The query string is parsed strictly: an unknown parameter, or `detail` given more than once, is a `400` (after the key has been accepted).
      security:
        - agentKey: []
      parameters:
        - name: detail
          in: query
          required: false
          description: |
            Return objects with placeholders instead of plain names. The server treats an empty value, `1`, `true` and `yes` (any letter case) as true, and any other value as false. Send `true` or leave the parameter out.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: |
            An array of credential names, or with `detail=true` an array of credential objects. An empty array when the key may use no credentials or the vault holds none.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/CredentialName"
                  - type: array
                    items:
                      $ref: "#/components/schemas/CredentialDetail"
              examples:
                names:
                  summary: Plain names
                  value:
                    - grafana_service_account
                    - Example Service (prod)
                detail:
                  summary: With detail=true
                  value:
                    - name: Example Service (prod)
                      type: login
                      placeholder: "{{vault:'Example Service (prod)'}}"
                      username: "{{vault:'Example Service (prod)':username}}"
                      fields:
                        api secret: "{{vault:'Example Service (prod)':field:'api secret'}}"
                      bound_to:
                        - https://api.example.com
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/VaultLocked"
    post:
      operationId: createCredential
      tags: [agent]
      summary: Create a credential with a generated password
      description: |
        Asks Ferrowarden to create a new login in the operator's **managed collection** (`vault.managed.collection`). Ferrowarden generates the password itself from the operating system's random generator, encrypts it and stores it, and answers with the name and a placeholder. **The generated value is never returned**, here or anywhere an agent can read: use it only through the placeholder (`{{vault:name}}`), for example to set up a new service through a forward request. See `docs/managed-credentials.md`.

        The key needs a `create` pattern that matches the name. That permission is separate from the key's `credentials` and `methods`.

        Checks run in this order, each before the next, and **nothing is generated or written until a human has approved**: the key is valid (`401`); the body is strict JSON and every field is valid (`400`); each URI passes the outbound target policy (`403`); the key's `create` patterns match the name (`403` `credential_create_out_of_scope`); creating is switched on (`403` `credential_create_disabled`) and the managed collection can be written to (`503` `managed_collection_unavailable`, with a `reason`); a fresh sync finds no vault item with that name anywhere (`409` `credential_exists`, before any prompt); a human approves this one operation (below); then the value is generated, encrypted and written (`502` `vault_write_failed` if the vault refuses the write, `502` `vault_write_unknown` if the outcome is not known: the item may exist).

        **Approval.** Every create needs a human's approval of exactly this operation (key, name, username, URIs, generation options, approval flag). The request is held for up to the operator's `approval.wait_secs` (60 seconds by default). If a person approves, the credential is created and the answer is `201`. If they deny, the answer is `403` with `code` `approval_denied`: stop, and tell your human. If nobody has decided when the wait ends, the answer is `403` with `code` `approval_pending` and an `approval_id`: ask your human to approve it, then **retry the identical request**. An approval covers one operation once: it is used up by the request it lets through, and never becomes a timed grant. A key with too many open or recent approval requests gets `429` with `code` `approval_limit_reached`. A client of this operation needs a read timeout above the operator's `approval.wait_secs`, up to 300 seconds.

        If the item was written but the credential cache could not be refreshed afterwards, the answer is still `201` with `cache_refreshed: false`: the placeholder works as soon as the next refresh has run.
      security:
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredentialRequest"
            examples:
              keycloak:
                summary: A new service account for a service
                value:
                  name: agent_keycloak_svc
                  username: svc-agent
                  uris:
                    - https://keycloak.example.com
                  generate:
                    length: 32
                    charset: alphanumeric
      responses:
        "201":
          description: The credential was created. The body has its name and placeholder, never its value.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCredentialResponse"
              examples:
                created:
                  value:
                    name: agent_keycloak_svc
                    placeholder: "{{vault:agent_keycloak_svc}}"
                    cache_refreshed: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Refused. `code` says why: `credential_create_out_of_scope` (the key has no `create` pattern for this name), `credential_create_disabled` (the operator has not set `vault.managed.collection`), `approval_denied` (a human said no: stop and tell them), or `approval_pending` (not decided yet: retry the identical request after your human approves, quoting `approval_id`). A URI that the outbound target policy blocks is also `403`, without a `code`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                outOfScope:
                  value:
                    error: This agent key may not create a credential called other_name
                    code: credential_create_out_of_scope
                disabled:
                  value:
                    error: "Creating and rotating credentials is switched off: no managed collection is configured (vault.managed.collection)"
                    code: credential_create_disabled
                approvalPending:
                  summary: Waiting for a human; retry the identical request after they approve
                  value:
                    error: "Approval required: a human has to approve this request. Ask your human to approve approval 2m3x8Qk0Zr1YtV5pUa9bLw, then retry the same request."
                    code: approval_pending
                    approval_id: 2m3x8Qk0Zr1YtV5pUa9bLw
                approvalDenied:
                  value:
                    error: "Approval denied: a human denied this request. Do not retry it; tell your human what was refused."
                    code: approval_denied
        "409":
          description: A vault item with that name already exists (in any collection). Nothing was asked of a human and nothing was written. Choose another name.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                exists:
                  value:
                    error: A credential called agent_keycloak_svc already exists; choose another name
                    code: credential_exists
        "429":
          description: |
            Either the per-IP rate limit was exceeded (a plain-text body, with a `Retry-After` header), or this agent key has too many open or recent approval requests (`code` `approval_limit_reached`, a JSON body).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            text/plain:
              schema:
                type: string
              example: Rate limit exceeded. See the Retry-After header.
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |
            The write did not go through. `code` says what is known: `vault_write_failed` (the vault refused the credentials **before anything was written**: nothing was created; the generated value is gone, a retry needs a new approval) or `vault_write_unknown` (any other failure: a timeout, a lost connection, a server error or an unrecognised `4xx`: the item **may have been created**; read the credentials again with `GET /v1/credentials?detail=true` before retrying: if the name is listed the create was applied, and a retry would be `409` `credential_exists`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                writeFailed:
                  value:
                    error: The vault refused the write; nothing was created or changed. Try again later.
                    code: vault_write_failed
                writeUnknown:
                  value:
                    error: "The write may have been applied: read the credential again (GET /v1/credentials?detail=true) before retrying."
                    code: vault_write_unknown
        "503":
          description: |
            The vault is locked or Vaultwarden cannot be reached, or the managed collection cannot be written to (`code` `managed_collection_unavailable`, with a `reason`: `not_found`, `read_only`, `hides_passwords`, `ambiguous_name` or `no_organization_key`). Nothing falls back to another collection or to the personal vault.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                locked:
                  value:
                    error: Vault is locked
                unavailable:
                  value:
                    error: "The managed collection cannot be written to right now: the account has only view access to the managed collection (it needs Can edit)"
                    code: managed_collection_unavailable
                    reason: read_only
  /v1/credentials/{name}/rotate:
    parameters:
      - $ref: "#/components/parameters/CredentialNamePath"
    post:
      operationId: rotateCredential
      tags: [agent]
      summary: Start rotating a credential's password
      description: |
        Starts a **two-phase rotation** of the password of a credential that is in the operator's **managed collection**. Ferrowarden generates a new password from the operating system's random generator and stores it on the item as a **pending** value; the current password is not touched. `{{vault:name}}` is still the current password and `{{vault:name:next}}` is the new one. **No value is ever returned**: use the placeholders in forward requests, for example to call the service's own change-password endpoint, signing in with `{{vault:name}}` and sending `{{vault:name:next}}`. The answer carries a **`rotation_id`**, an opaque identifier of exactly this pending value: commit or abort it by sending that id back. (If you lose the answer, the detailed credential listing shows the `rotation_id` of every pending rotation.) Then finish with `commitCredentialRotation`, or, **only after the service has confirmed that it rejected the change**, throw the pending value away with `abortCredentialRotation`. See `docs/managed-credentials.md`.

        `{name}` is the credential's name, URL-encoded: every character that is not a letter, a digit or one of `-` `_` `.` `~` is written as `%XX`, so a space is `%20` and a `/` is `%2F`.

        The key needs a `rotate` pattern that matches the name, and the name must be in the key's `credentials` scope. That permission is separate from `create`, `credentials` and `methods`. Only a **login** that has a password, no master password re-prompt and a name that is unique in the vault, **in the managed collection**, can be rotated. Items need not have been created by Ferrowarden: a person can move an existing item into the managed collection to put it under agent maintenance.

        Checks run in this order, each before the next, and **nothing is generated or written until a human has approved**: the key is valid (`401`); the body is strict JSON, or left out (`400`); the key's `rotate` patterns match the name (`403` `credential_rotate_out_of_scope`); rotating is switched on (`403` `credential_create_disabled`) and the managed collection can be written to (`503` `managed_collection_unavailable`); a fresh sync finds the item (`403` `credential_not_managed`, the same answer whether the name exists elsewhere in the vault or not at all, and for a name outside the key's `credentials` scope; `409` when the managed collection has the name and another item, in or out of the collection, shares it; `422` `credential_not_rotatable` for anything but a login with a password and no re-prompt); no rotation is pending on it already (`409` `rotation_in_progress`); a human approves this one operation (below); then the value is generated, encrypted and written.

        **Approval.** Every start needs a human's approval of exactly this operation (key, item, name, generation options). The request is held for up to the operator's `approval.wait_secs` (60 seconds by default). If a person approves, the rotation starts and the answer is `202`. If they deny, the answer is `403` with `code` `approval_denied`: stop, and tell your human. If nobody has decided when the wait ends, the answer is `403` with `code` `approval_pending` and an `approval_id`: ask your human to approve it, then **retry the identical request**. An approval covers one start once; committing or aborting needs no second approval. A client of this operation needs a read timeout above the operator's `approval.wait_secs`, up to 300 seconds.

        **Conflicts.** Every write names the revision of the item that was read. If a person changed the item in the meantime, the answer is `409` `vault_conflict`, and **nothing is overwritten**: read the credential again and retry. The same answer, saying the item no longer exists, is given when it was deleted. If the item was **replaced** (another item with the same name) while the approval was pending, the answer is `409` `vault_conflict` and nothing is written: start again.
      security:
        - agentKey: []
      requestBody:
        required: false
        description: Optional. Leave it out (or send `{}`) for the defaults.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateCredentialRequest"
            examples:
              defaults:
                summary: A new 32-character alphanumeric password
                value: {}
              options:
                summary: Choose the length and the characters
                value:
                  generate:
                    length: 24
                    charset: ascii
      responses:
        "202":
          description: The rotation started. The new password is pending on the item. The body has the placeholders, never a value.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateStarted"
              examples:
                started:
                  value:
                    name: agent_keycloak_svc
                    current: "{{vault:agent_keycloak_svc}}"
                    next: "{{vault:agent_keycloak_svc:next}}"
                    rotation_id: 6WnQ3xZk0m1YtV5pUa9bLw
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Refused. `code` says why: `credential_rotate_out_of_scope` (the key has no `rotate` pattern for this name), `credential_not_managed` (the item is not in the managed collection, or does not exist, or is outside the key's `credentials` scope), `credential_create_disabled` (the operator has not set `vault.managed.collection`), `approval_denied` (a human said no: stop and tell them) or `approval_pending` (not decided yet: retry the identical request after your human approves, quoting `approval_id`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                outOfScope:
                  value:
                    error: This agent key may not rotate a credential called agent_keycloak_svc
                    code: credential_rotate_out_of_scope
                notManaged:
                  value:
                    error: There is no credential called other_name in the managed collection, so it cannot be rotated
                    code: credential_not_managed
                approvalPending:
                  summary: Waiting for a human; retry the identical request after they approve
                  value:
                    error: "Approval required: a human has to approve this request. Ask your human to approve approval 2m3x8Qk0Zr1YtV5pUa9bLw, then retry the same request."
                    code: approval_pending
                    approval_id: 2m3x8Qk0Zr1YtV5pUa9bLw
        "409":
          description: |
            `rotation_in_progress` (a rotation is already pending on the item: commit or abort it first), `vault_conflict` (a person changed, deleted or replaced the item while it was being rotated, or it needs a person to fix it: nothing was overwritten) or, without a `code`, two vault items share the name.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                inProgress:
                  value:
                    error: "A rotation of agent_keycloak_svc is already in progress: commit it or abort it first"
                    code: rotation_in_progress
        "422":
          description: "`credential_not_rotatable`: the item is not a login, has no password, or has master password re-prompt turned on."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Either the per-IP rate limit was exceeded (a plain-text body, with a `Retry-After` header), or this agent key has too many open or recent approval requests (`code` `approval_limit_reached`, a JSON body).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            text/plain:
              schema:
                type: string
              example: Rate limit exceeded. See the Retry-After header.
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |
            The write did not go through. `code` `vault_write_failed`: the vault refused the credentials before anything was written, nothing was changed; the generated value is gone and a retry needs a new approval. `code` `vault_write_unknown`: any other failure (a timeout, a lost connection, a server error, an unrecognised `4xx`), so the write **may have been applied**: read the credential again with `GET /v1/credentials?detail=true` (`rotation_pending` and `rotation_id` say which state the item is in) before doing anything else.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            The vault is locked or Vaultwarden cannot be reached, or the managed collection cannot be written to (`code` `managed_collection_unavailable`, with a `reason`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/credentials/{name}/rotate/commit:
    parameters:
      - $ref: "#/components/parameters/CredentialNamePath"
    post:
      operationId: commitCredentialRotation
      tags: [agent]
      summary: Make the pending password the password
      description: |
        Finishes a rotation: the pending new password becomes the password, the old password goes to the item's **password history** (newest first, at most five entries are kept), the item's password-changed date is set, and the pending value is removed. Do this after the new password has been set at the service. **No second approval**: the approval of the start covered the rotation.

        The body names the rotation: `{ "rotation_id": "..." }`, the id the start returned (or the detailed listing shows). The write happens only if the pending value on the item now is the one that id names: `409` `rotation_mismatch` otherwise (the rotation was finished, or replaced, since), and nothing is written. So a request repeated after its answer was lost can never finish the next rotation.

        The same policy and item checks as the start apply (`403` `credential_rotate_out_of_scope`, `403` `credential_not_managed`, `422` `credential_not_rotatable`). `409` `no_rotation_pending` when none was started. If a person changed the item since the rotation started, nothing is overwritten: their edits of the notes, URIs or other fields are kept and the commit goes through; if they changed the **password**, the answer is `409` `vault_conflict` ("the password was changed after the rotation started") and nothing is written: abort, or ask a person. A pending value that is empty or cannot be read back fails closed the same way (a person has to fix the item).
      security:
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotationFinishRequest"
      responses:
        "200":
          description: The new password is now the password. The body has the name and its placeholder, never a value.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateFinished"
              examples:
                committed:
                  value:
                    name: agent_keycloak_svc
                    placeholder: "{{vault:agent_keycloak_svc}}"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`credential_rotate_out_of_scope`, `credential_not_managed` or `credential_create_disabled`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `no_rotation_pending`, `rotation_mismatch` (the pending value is not the one `rotation_id` names: nothing was written), `vault_conflict` (someone changed or deleted the item: nothing was overwritten), or, without a `code`, two vault items share the name.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noRotation:
                  value:
                    error: "No rotation of agent_keycloak_svc is pending: start one first"
                    code: no_rotation_pending
                conflict:
                  value:
                    error: "Someone changed the item in the vault while it was being rotated, or it needs a person to fix it. Nothing was overwritten: re-read the credential and try again."
                    code: vault_conflict
        "422":
          description: "`credential_not_rotatable`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "The vault refused the write (`code` `vault_write_failed`: the login was refused before anything was written, nothing was changed) or its outcome is not known (`vault_write_unknown`: any other failure, it may have been applied; read the credential again, `GET /v1/credentials?detail=true`, before doing anything else)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The vault is locked or unreachable, or the managed collection cannot be written to (`code` `managed_collection_unavailable`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/credentials/{name}/rotate/abort:
    parameters:
      - $ref: "#/components/parameters/CredentialNamePath"
    post:
      operationId: abortCredentialRotation
      tags: [agent]
      summary: Throw the pending password away
      description: |
        Aborts a rotation: the pending new password is removed and the password is the one it was. **The discarded value is not lost**: it goes to the front of the item's password history (newest first, at most five entries are kept), so if the service had in fact already switched to it, a person can still recover it there.

        Abort **only after the service has confirmed that it rejected the change**. If the outcome is unknown (a timeout, a lost answer), first find out which password the service accepts, for example with a harmless authenticated call using `{{vault:name:next}}`: if it accepts the new one, commit; if it does not, abort. If that cannot be established, ask your human.

        **No approval.** The body names the rotation, like a commit's: `{ "rotation_id": "..." }`. The same checks and answers as `commitCredentialRotation` apply.
      security:
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotationFinishRequest"
      responses:
        "200":
          description: The pending password was removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateFinished"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`credential_rotate_out_of_scope`, `credential_not_managed` or `credential_create_disabled`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`no_rotation_pending`, `rotation_mismatch`, `vault_conflict`, or, without a `code`, two vault items share the name."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`credential_not_rotatable`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "The vault refused or failed the write (`code` `vault_write_failed`), or the outcome is not known (`vault_write_unknown`: read the credential again before doing anything else)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The vault is locked or unreachable, or the managed collection cannot be written to (`code` `managed_collection_unavailable`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/forward:
    post:
      operationId: forwardRequest
      tags: [agent]
      summary: Forward a request with credentials substituted
      description: |
        Sends the request in `request` to its target and returns the target's response. Placeholders in the URL, headers and body are replaced with credential values from the vault before the request leaves Ferrowarden, and known credential values are scrubbed from the response. See `ProxyRequest` for the placeholder grammar.

        A `200` means Ferrowarden forwarded the request and got an answer. The target's own status, including a `404` or `500` from the target, is in the `status` field of the body. Redirects are not followed.

        Checks run before anything is sent, and a failure stops the request with no outbound call. In order: the body is well formed, every `capture` entry is valid and every placeholder parses (`400`, `422`); the key's method policy allows the method (`403`); the key's credential scope covers every `{{vault:...}}` placeholder (`403`, the same answer whether or not the credential exists); every vault placeholder names one usable vault item (`422`, `409`, `403` for a re-prompt item); each credential is bound to the target host (`403`); the target passes the outbound policy (`403`); every `{{session:NAME}}` names a live session of this key that was captured from the target's origin (`422` unknown or expired, `403` another origin).

        **Approval.** The last check, after all of those and before any credential value is fetched, applies to a credential that needs a human's approval (its vault item says so, or the key's policy does). The request is held for up to the operator's `approval.wait_secs` (60 seconds by default) while a person decides in the operator's web UI. If they approve, the request goes on and the answer is the target's, as usual. If they deny, the answer is `403` with `code` `approval_denied`: stop, and do not look for another way to use the credential. If nobody has decided when the wait ends, the answer is `403` with `code` `approval_pending` and an `approval_id`: ask your human to approve it, then **retry the same request**. The approval stays open for a few minutes, and once approved it covers this key's later requests for the same credentials at the same host until it ends, so the retry goes through. A key with too many open or recent approval requests gets `429` with `code` `approval_limit_reached`. Nothing is sent to the target, and no value is read, until the approval is granted. A client of this operation therefore needs a read timeout above the operator's `approval.wait_secs`, up to 300 seconds, plus the target's own time.

        With `capture`, the login token in the response never reaches the agent. See `CaptureSpec` and `ProxyResponse.captures`, and `docs/sessions.md`.

        A target that times out, refuses the connection or returns more than the operator's response limit is reported as `502`. A request body larger than 2 MiB is reported as `400`.
      security:
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardPayload"
            examples:
              getWithHeader:
                summary: GET with a credential in a header
                value:
                  request:
                    method: GET
                    url: https://api.example.com/v1/items
                    headers:
                      Authorization: "Bearer {{vault:example_api_token}}"
              postJson:
                summary: POST with a JSON body
                value:
                  request:
                    method: POST
                    url: https://api.example.com/v1/items
                    headers:
                      X-Api-Key: "{{vault:'Example Service (prod)':field:'api secret'}}"
                    body:
                      name: example
              login:
                summary: Log in and keep the token inside Ferrowarden
                value:
                  request:
                    method: POST
                    url: https://portainer.example.com/api/auth
                    body:
                      username: "{{vault:portainer:username}}"
                      password: "{{vault:portainer}}"
                  capture:
                    - from: "json:/jwt"
                      as: portainer
              useSession:
                summary: Use the captured session
                value:
                  request:
                    method: GET
                    url: https://portainer.example.com/api/endpoints
                    headers:
                      Authorization: "Bearer {{session:portainer}}"
      responses:
        "200":
          description: The target answered. See `status` for the target's status code.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyResponse"
              examples:
                json:
                  summary: A JSON response from the target
                  value:
                    status: 200
                    headers:
                      content-type: application/json
                    body: '{"items":[]}'
                    body_encoding: utf8
                login:
                  summary: A login whose token was captured
                  value:
                    status: 200
                    headers:
                      content-type: application/json
                    body: '{"jwt":"[CAPTURED:portainer]"}'
                    body_encoding: utf8
                    captures:
                      - as: portainer
                        status: captured
                        expires_at: "2026-01-01T12:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The request was refused on policy grounds. The message says which check: the method is not allowed for this key, the credential is not available to this key, the credential is not bound to the target host, the item has master password re-prompt enabled, the target is not allowed by the outbound policy, a `{{session:NAME}}` was captured from another origin than the target (`session_host_not_allowed`), or a credential needs a human's approval (`code` `approval_pending`: not decided yet, retry the same request after your human approves; `code` `approval_denied`: a human said no, stop).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                outOfScope:
                  value:
                    error: Credential example_api_token is not available to this agent key
                approvalPending:
                  summary: Waiting for a human; retry the same request after they approve
                  value:
                    error: "Approval required: a human has to approve this request. Ask your human to approve approval 2m3x8Qk0Zr1YtV5pUa9bLw, then retry the same request."
                    code: approval_pending
                    approval_id: 2m3x8Qk0Zr1YtV5pUa9bLw
                approvalDenied:
                  summary: A human denied the request
                  value:
                    error: "Approval denied: a human denied this request. Do not retry it; tell your human what was refused."
                    code: approval_denied
        "404":
          description: A credential that passed the earlier checks was not found in the vault when its value was fetched.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A placeholder name matches more than one vault item, or the named field appears more than once on the item.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            A placeholder is malformed, or names a credential or field the vault does not have, or a `{{session:NAME}}` names a session that is not there (`unknown_session`, which is the same answer whether the session is absent, expired or captured by another agent key).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknown:
                  value:
                    error: "Placeholder references an unknown credential or field: no_such_credential"
        "429":
          description: |
            Either the per-IP rate limit was exceeded (a plain-text body, with a `Retry-After` header), or this agent key has too many open or recent approval requests (`code` `approval_limit_reached`, a JSON body, no `Retry-After`). In the second case, do not retry now: tell your human, and wait for the open approvals to be decided or to expire.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            text/plain:
              schema:
                type: string
              example: Rate limit exceeded. See the Retry-After header.
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                approvalLimit:
                  value:
                    error: Too many approval requests from this agent key. Wait for the pending ones to be decided or to expire, then retry.
                    code: approval_limit_reached
        "502":
          description: The target could not be reached, timed out, or returned a response larger than the configured limit, or the vault backend failed. The message does not include the target URL.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/VaultLocked"
  /v1/sessions:
    get:
      operationId: listSessions
      tags: [agent]
      summary: List this key's captured sessions
      description: |
        The live sessions the calling key captured with `capture` (see `forwardRequest`): name, the host each is bound to and when it expires. Never a value. Sessions of other keys are not listed, and expired ones are not either.
      security:
        - agentKey: []
      responses:
        "200":
          description: An array of sessions, sorted by name. Empty when the key has none.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
              examples:
                one:
                  value:
                    - name: portainer
                      host: portainer.example.com
                      expires_at: "2026-01-01T12:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/sessions/{name}:
    delete:
      operationId: deleteSession
      tags: [agent]
      summary: Forget a captured session
      description: |
        Removes one of the calling key's captured sessions. A name that is absent, expired or belongs to another key is the same `422` (`unknown_session`).
      security:
        - agentKey: []
      parameters:
        - name: name
          in: path
          required: true
          description: The session name.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_.-]{1,64}$"
      responses:
        "204":
          description: The session was removed. The body is empty.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The key has no live session of that name (`unknown_session`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknown:
                  value:
                    error: Session portainer is unknown or expired; log in again
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/unlock:
    post:
      operationId: unlockVault
      tags: [admin]
      summary: Unlock the vault (manual unlock mode)
      description: |
        Sends the vault master password to the vault backend and, on success, reloads the credential list. Only available when Ferrowarden runs with `unlock_mode = manual`; with `file` mode the vault unlocks at startup and this endpoint returns `404`.

        The password is not stored or logged. The body is read only after the admin key has been accepted.
      security:
        - adminKey: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
            examples:
              unlock:
                value:
                  password: example-master-password
      responses:
        "200":
          description: The vault is unlocked and the credential list is loaded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockResponse"
              examples:
                unlocked:
                  value:
                    status: unlocked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The admin key is missing or invalid, or the vault backend rejected the master password.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The instance runs in `file` unlock mode, so this endpoint is disabled.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The vault backend failed while the credential list was being loaded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/VaultLocked"
  /v1/admin/keys:
    get:
      operationId: listKeys
      tags: [admin]
      summary: List agent keys
      description: |
        Lists every active agent key with its policy. Token values are not included. A key created with 0.1.0 and without a policy shows `policy_set: false` and is deny-all until a policy is set. The query string is ignored.
      security:
        - adminKey: []
        - adminBearer: []
      responses:
        "200":
          description: The agent keys, in no particular order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeySummary"
              examples:
                keys:
                  value:
                    - id: 3f2b8c1e-7a4d-4e5f-9b0a-1c2d3e4f5a6b
                      name: homelab-agent
                      created_at: "2026-01-15T12:00:00Z"
                      credentials:
                        - grafana_*
                      methods:
                        - GET
                        - HEAD
                      policy_set: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createKey
      tags: [admin]
      summary: Create an agent key
      description: |
        Creates an agent key with an explicit policy. Both `credentials` and `methods` are required: there is no default access. Use `["*"]` to allow everything and `[]` to allow nothing.

        The token is returned in this response only. Ferrowarden keeps a SHA-256 hash of it, so it cannot be shown again.
      security:
        - adminKey: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
            examples:
              readOnly:
                summary: Read-only access to Grafana credentials
                value:
                  name: homelab-agent
                  credentials:
                    - grafana_*
                  methods:
                    - GET
                    - HEAD
      responses:
        "201":
          description: The key was created. This is the only response that contains its token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
              examples:
                created:
                  value:
                    id: 3f2b8c1e-7a4d-4e5f-9b0a-1c2d3e4f5a6b
                    name: homelab-agent
                    token: ExampleTokenNotRealExampleTokenNotRealExample
                    created_at: "2026-01-15T12:00:00Z"
                    credentials:
                      - grafana_*
                    methods:
                      - GET
                      - HEAD
                    policy_set: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/keys/{id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    patch:
      operationId: updateKeyPolicy
      tags: [admin]
      summary: Change an agent key's policy
      description: |
        Replaces the policy fields present in the body. A field that is left out is unchanged, a field that is present replaces the old value, and `null` is rejected. `{}` is rejected (nothing to change). To lift a restriction send `["*"]`.

        The change applies to the next request made with that key, and the token stays the same. It is written to the key file, when persistence is configured, before it takes effect. On a key without a policy (`policy_set: false`) a field you leave out stays deny-all, so send both fields to make it usable.
      security:
        - adminKey: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchKeyRequest"
            examples:
              widen:
                value:
                  credentials:
                    - grafana_*
                    - uptime_*
      responses:
        "200":
          description: The updated key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: revokeKey
      tags: [admin]
      summary: Revoke an agent key
      description: |
        Removes the key from memory and, when persistence is configured, from the key file. Requests made with its token are refused from the next request on.
      security:
        - adminKey: []
        - adminBearer: []
      responses:
        "200":
          description: The key was revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeKeyResponse"
              examples:
                revoked:
                  value:
                    status: revoked
                    id: 3f2b8c1e-7a4d-4e5f-9b0a-1c2d3e4f5a6b
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/keys/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: previewKeyPolicy
      tags: [admin]
      summary: Preview a draft policy for an agent key
      description: |
        Shows what a draft policy would allow for an existing key, without saving it, reading any credential value, or sending anything. `credentials` and `methods` are the draft; a field that is left out means the key's saved value, and `null` is rejected. `request`, if given, has the same shape as the `request` of `forwardRequest` and is checked against the draft policy.

        The check runs the same validations as a real forward, in the same order and with the same statuses, reasons and messages. It does not connect to anything: the outbound policy is applied to the host name and IP literals only, and the private-address check on a resolved DNS name happens when a request is really forwarded. While the vault is locked the answer comes from the cached credential list.
      security:
        - adminKey: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
            examples:
              narrow:
                value:
                  credentials:
                    - grafana_*
                  methods:
                    - GET
                  request:
                    method: GET
                    url: https://grafana.example.com/api/health
                    headers:
                      Authorization: "Bearer {{vault:grafana_token}}"
      responses:
        "200":
          description: The preview.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
              examples:
                denied:
                  value:
                    key:
                      id: 3f2b8c1e-7a4d-4e5f-9b0a-1c2d3e4f5a6b
                      name: homelab-agent
                      policy_set: true
                    saved_policy:
                      credentials:
                        - "*"
                      methods:
                        - "*"
                    draft_policy:
                      credentials:
                        - grafana_*
                      methods:
                        - GET
                    credentials:
                      - name: grafana_token
                        type: login
                        placeholder: "{{vault:grafana_token}}"
                        bound_to:
                          - https://grafana.example.com
                    gained: []
                    lost:
                      - uptime_token
                    request_check:
                      allowed: true
                      note: The target host is checked against the outbound policy by name and IP literal only; private-address checks on resolved DNS names happen when a request is actually forwarded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/VaultLocked"
  /v1/admin/audit:
    get:
      operationId: listAuditEvents
      tags: [admin]
      summary: Read recent security events
      description: |
        Returns the newest security events, newest first, from the in-memory buffer. The buffer holds `events.buffer_size` events (default 1000) and is emptied on restart, so use an event sink for history that has to last.

        The query string is parsed strictly: an unknown or repeated parameter, or a `limit` outside the range, is a `400`.
      security:
        - adminKey: []
        - adminBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          description: How many events to return, from 1 up to the buffer size (`events.buffer_size`, default 1000). The default is 100, or the buffer size if that is smaller.
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        "200":
          description: Security events, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/admin/status:
    get:
      operationId: getStatus
      tags: [admin]
      summary: Read operational status
      description: |
        Returns whether the vault is locked, how many credentials are cached, and how many agent keys exist. The query string is ignored.
      security:
        - adminKey: []
        - adminBearer: []
      responses:
        "200":
          description: Current status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                unlocked:
                  value:
                    locked: false
                    vault_backend: native
                    credential_count: 12
                    agent_key_count: 2
                    managed_collection:
                      configured: true
                      usable: true
                      id: 6c0d7f0e-52d0-4b5b-8a39-0e8a7f6d5c4b
                      name: Ferrowarden managed
                      items: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/admin/notify/test:
    post:
      operationId: sendTestNotification
      tags: [admin]
      summary: Send a test notification
      description: |
        Sends one test notification to every enabled notifier (Gotify, ntfy, webhook) now, waits for each answer (up to 10 seconds each, no retries) and reports the result per notifier. The notification carries fixed text only. It is not subject to the notification rate limits, but a second test within 10 seconds of the first gets `429`, and the call counts against the per-IP admin rate limit. With no notifier configured, `results` is empty. The request has no body, and any body or query string is ignored.

        The `error` text is one of a few fixed phrases (`timed out`, `could not connect`, `the request failed`, or `the notifier answered HTTP <status>`). It never contains a URL, a path or a token. See `docs/notifications.md`.
      security:
        - adminKey: []
        - adminBearer: []
      responses:
        "200":
          description: The test was sent. A notifier that failed is reported in `results`, not as an error status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyTestResponse"
              examples:
                oneFailed:
                  value:
                    results:
                      - sender: gotify
                        ok: true
                        status: 200
                      - sender: webhook
                        ok: false
                        error: could not connect
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/admin/approvals:
    get:
      operationId: listApprovals
      tags: [admin]
      summary: List pending approvals and live grants
      description: |
        Lists the approvals waiting for a human's decision and the grants that are live now. Both live in memory only. The query string is ignored. See `docs/approvals.md`.
      security:
        - adminKey: []
        - adminBearer: []
      responses:
        "200":
          description: The pending approvals, oldest first, and the live grants, soonest to end first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
              examples:
                one:
                  value:
                    pending:
                      - id: 2m3x8Qk0Zr1YtV5pUa9bLw
                        key:
                          id: 3f2b8c1e-7a4d-4e5f-9b0a-1c2d3e4f5a6b
                          name: homelab-agent
                        credentials:
                          - credential: proxmox_root
                            reasons:
                              - vault_field
                        method: GET
                        origin:
                          scheme: https
                          host: pve.example.com:8006
                          port: 8006
                        url: https://pve.example.com:8006/api2/json/nodes
                        request_id: 0193abcd-1111-7222-8333-444455556666
                        created_at: "2026-01-15T12:00:00Z"
                        expires_at: "2026-01-15T12:10:00Z"
                    grants: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/admin/approvals/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      operationId: approveApproval
      tags: [admin]
      summary: Approve a pending approval
      description: |
        What the body is depends on the approval's `kind` (see `listApprovals`).

        A `forward` approval takes `{ "minutes": N }` (1 to `approval.max_grant_minutes`). The grant covers the approval's agent key, its credentials and its target origin until it ends. Requests held on the approval proceed at once, and a request retried within the grant passes.

        A `create` or `rotate` approval takes **no body** (an empty body, or `{}`): it has no duration. It allows exactly one operation, the one it was opened for. The request held on it proceeds at once, or, if none is held any more, the agent's identical retry within `approval.pending_ttl_secs` uses it up. It never becomes a grant. A body with `minutes` is a `400`.

        The approver is recorded as `admin_api`. An agent key cannot call this: it is refused like any request without the admin key. An approval that is no longer pending (decided, expired or cleared) is `409` and nothing changes.
      security:
        - adminKey: []
        - adminBearer: []
      requestBody:
        required: false
        description: "`{ \"minutes\": N }` for a `forward` approval; nothing (or `{}`) for a `create` approval."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
            examples:
              fifteen:
                value:
                  minutes: 15
      responses:
        "200":
          description: Approved. For a `forward` approval the grant is in the body; a `create` approval has none.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ApprovalNotPending"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/admin/approvals/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      operationId: denyApproval
      tags: [admin]
      summary: Deny a pending approval
      description: |
        Denies the approval. Requests held on it are answered `approval_denied`, and so is a retry, at once and without a new prompt, for `approval.pending_ttl_secs`. The request has no body. An approval that is no longer pending is `409` and nothing changes.
      security:
        - adminKey: []
        - adminBearer: []
      responses:
        "200":
          description: Denied.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
              examples:
                denied:
                  value:
                    status: denied
                    id: 2m3x8Qk0Zr1YtV5pUa9bLw
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ApprovalNotPending"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/admin/grants/{id}:
    parameters:
      - $ref: "#/components/parameters/GrantId"
    delete:
      operationId: revokeGrant
      tags: [admin]
      summary: End a grant early
      description: |
        Ends a live grant now. The next request that needs its credentials asks again. A grant that is not live (revoked, expired or cleared) is `404`.
      security:
        - adminKey: []
        - adminBearer: []
      responses:
        "200":
          description: The grant was revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
              examples:
                revoked:
                  value:
                    status: revoked
                    id: 9k2Lq7VxT0aBn4RzC1mYdE
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: There is no live grant with that id.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/admin/credentials/{name}/rotate/abort:
    parameters:
      - $ref: "#/components/parameters/CredentialNamePath"
    post:
      operationId: adminAbortCredentialRotation
      tags: [admin]
      summary: Clear a stuck rotation
      description: |
        Removes the pending new password of a credential in the managed collection, for an operator: a rotation that an agent started and never committed or aborted. The current password is unchanged, and the discarded value is kept in the item's password history. **Check which password the service accepts before you abort**: if the agent changed it there and lost the answer, the service may already use the pending one. Only the managed collection is checked (an operator is not an agent key, so there is no `rotate` pattern to match). The body names the rotation (`{ "rotation_id": "..." }`, from the detailed listing or the Approvals page): `409` `rotation_mismatch` if the pending value is another one (a stale form), and nothing is written. `409` `vault_conflict` if someone changed the item since the rotation started (nothing is overwritten: try again). `{name}` is URL-encoded like `rotateCredential`'s.
      security:
        - adminKey: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotationFinishRequest"
      responses:
        "200":
          description: The pending password was removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, name]
                properties:
                  status:
                    type: string
                    const: aborted
                  name:
                    type: string
              examples:
                aborted:
                  value:
                    status: aborted
                    name: agent_keycloak_svc
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`credential_not_managed`: the credential is not in the managed collection, or does not exist."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`no_rotation_pending`, `vault_conflict`, or, without a `code`, two vault items share the name."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`credential_not_rotatable`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "The vault refused the write (`code` `vault_write_failed`: the login was refused before anything was written, nothing was changed) or its outcome is not known (`vault_write_unknown`: any other failure, it may have been applied; read the credential again, `GET /v1/credentials?detail=true`, before doing anything else)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The vault is locked or unreachable, or the managed collection cannot be written to.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    agentKey:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: An agent key issued by the operator. Scoped to the agent operations and to the key's own policy.
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: The operator's admin key (`FERROWARDEN_ADMIN_KEY`).
    adminBearer:
      type: http
      scheme: bearer
      description: The admin key as a bearer token. Accepted wherever `adminKey` is, and kept for compatibility with earlier releases of `unlockVault`. If both headers are sent, `X-Admin-Key` is the one that is checked.
  headers:
    XRequestId:
      description: An identifier Ferrowarden generates for the request (UUID v7). A value sent by the client is ignored. The same id appears in the security events the request produced, so quote it when you report a problem.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds to wait before the next request is likely to be accepted.
      schema:
        type: integer
        minimum: 1
  parameters:
    ApprovalId:
      name: id
      in: path
      required: true
      description: The id of an approval, as returned by `listApprovals` and in the `approval_id` of a prompt.
      schema:
        type: string
    GrantId:
      name: id
      in: path
      required: true
      description: The id of a grant, as returned by `listApprovals` and `approveApproval`.
      schema:
        type: string
    CredentialNamePath:
      name: name
      in: path
      required: true
      description: The credential's name, URL-encoded (every character other than a letter, a digit or `-` `_` `.` `~` as `%XX`; a space is `%20`, a `/` is `%2F`).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    KeyId:
      name: id
      in: path
      required: true
      description: The id of an agent key, as returned by `createKey` and `listKeys`.
      schema:
        type: string
  responses:
    BadRequest:
      description: |
        The request is not acceptable. Returned only after authentication succeeded. Typical causes: a body that is not strict JSON (duplicate key, unknown field, trailing data, nesting deeper than 64 levels, wrong content type, larger than 2 MiB), a missing or wrongly typed field, an unknown or repeated query parameter, or a value outside its allowed range. The message names the offending field and the position, and does not repeat values from the body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unknownField:
              value:
                error: "Invalid JSON: unknown field `extra`, expected one of `method`, `url`, `headers`, `body` (line 1, column 42)"
    Unauthorized:
      description: The key is missing or invalid. This is the answer to every unauthenticated request, whatever its body or query string contains.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              value:
                error: Missing or invalid agent API key
    ApprovalNotPending:
      description: The approval is no longer pending (it was decided, has expired or was cleared). Nothing was changed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            gone:
              value:
                error: "That approval is no longer pending: it was decided, has expired or was cleared. Nothing was changed."
    KeyNotFound:
      description: No agent key has that id.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unknown:
              value:
                error: Agent key not found
    RateLimited:
      description: The per-IP rate limit was exceeded. The body is plain text, not JSON.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        text/plain:
          schema:
            type: string
          example: Rate limit exceeded. See the Retry-After header.
    VaultLocked:
      description: The vault is locked, or Vaultwarden cannot be reached. Credentials cannot be read until the vault is unlocked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            locked:
              value:
                error: Vault is locked
    InternalError:
      description: An internal error, for example the key file could not be read or written. The message is generic.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internal:
              value:
                error: Internal server error
  schemas:
    Error:
      type: object
      description: The error body of every JSON error response. The message is fixed text plus, in some cases, a placeholder label, a key name or a position in the body. It does not contain credential values or the target URL.
      required: [error]
      properties:
        error:
          type: string
          description: A human-readable description.
        code:
          type: string
          description: A stable code, present on the answers about a human's approval and on the answers of `createCredential` and the rotation operations. Match on this, not on the message.
          enum:
            - approval_pending
            - approval_denied
            - approval_limit_reached
            - credential_create_disabled
            - credential_create_out_of_scope
            - credential_exists
            - managed_collection_unavailable
            - vault_write_failed
            - credential_rotate_out_of_scope
            - credential_not_managed
            - credential_not_rotatable
            - rotation_in_progress
            - no_rotation_pending
            - rotation_mismatch
            - vault_conflict
            - vault_write_unknown
        approval_id:
          type: string
          description: With `approval_pending`, the id of the approval the human has to decide. Quote it when you ask them.
        reason:
          type: string
          description: With `managed_collection_unavailable`, why the managed collection cannot be written to.
          enum: [not_found, read_only, hides_passwords, ambiguous_name, no_organization_key]
    OpenApiDocument:
      type: object
      description: An OpenAPI 3.1 document.
      required: [openapi, info, paths]
      properties:
        openapi:
          type: string
        info:
          type: object
        externalDocs:
          type: object
        servers:
          type: array
          items:
            type: object
        tags:
          type: array
          items:
            type: object
        paths:
          type: object
        components:
          type: object
    CredentialName:
      type: string
      description: The name of a vault item (login or secure note), as it is written in a placeholder after unquoting.
      examples:
        - grafana_service_account
    CredentialDetail:
      type: object
      description: |
        One credential as returned by `listCredentials` with `detail=true`. Every key other than `name` is present only when that value exists on the item. Placeholder strings are ready to paste into a request. They never contain the credential value.
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/CredentialName"
        type:
          type: string
          enum: [login, secure_note]
          description: The kind of vault item. Absent when the name is ambiguous.
        placeholder:
          type: string
          description: Placeholder for the item's password.
        next:
          type: string
          description: Placeholder for the pending new password of a rotation that was started and has not been committed or aborted. Present only then; use it to set the new password at the service.
        rotation_pending:
          type: boolean
          description: "`true` (present only then) when a rotation of this credential was started and is waiting to be committed or aborted."
        rotation_id:
          type: string
          description: "The identifier of the rotation (random, not derived from anything): what a commit or an abort must send. Present with `rotation_pending`, so that a start whose answer was lost can still be finished or aborted. Absent when the pending field cannot be named (a person has to fix the item)."
        username:
          type: string
          description: Placeholder for the login username.
        totp:
          type: string
          description: Placeholder for the current TOTP code.
        notes:
          type: string
          description: Placeholder for the item's notes.
        fields:
          type: object
          description: Placeholders for custom fields, keyed by field name.
          additionalProperties:
            type: string
        unavailable_fields:
          type: object
          description: Custom fields that cannot be used, keyed by field name, with the reason.
          additionalProperties:
            type: string
        bound_to:
          type: array
          description: The URIs the credential may be sent to. A request to any other host is refused with `403`.
          items:
            type: string
        unavailable:
          type: string
          description: Present when the item cannot be used at all (for example, two vault items share the name, or master password re-prompt is enabled), with the reason.
    ForwardPayload:
      type: object
      description: The body of `forwardRequest`.
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/ProxyRequest"
        capture:
          type: array
          minItems: 1
          maxItems: 8
          description: |
            Values of the response to keep inside Ferrowarden instead of returning them. Leave the member out for no capture; `null` and `[]` are rejected. Everything here is checked before the request is sent, and a capture that cannot be made never fails the request: the login already happened at the target, so the agent still gets its (scrubbed) response, with the outcome of each entry in `captures`.
          items:
            $ref: "#/components/schemas/CaptureSpec"
    CaptureSpec:
      type: object
      additionalProperties: false
      required: [from, as]
      description: |
        One value to capture from the response, and the name to keep it under. It is read from the raw response, on any status code, before scrubbing, and is stored only if it is a string of 4 to 16384 bytes. A value found at the source is removed from the response the agent sees, whether or not it was stored: `[CAPTURED:NAME]` when stored, `[REDACTED]` when it was found but could not be (`too_long`, `expired`, `limit_reached`). A value shorter than 4 characters is not stored and cannot be hidden.

        The session expires at the earliest of `ttl_secs`, the token's own `exp` (when the value is a JWT) and the cookie's `Max-Age` or `Expires`. These can only shorten the lifetime. A session is kept in memory for the agent key that captured it, bound to the origin (scheme, host and port) of the login request, and is cleared when the key is revoked or its policy changes, when the vault locks, and when Ferrowarden restarts. Capturing under a name the key already has replaces that session.
      properties:
        from:
          type: string
          description: |
            Where the value is:

            | Source | Value |
            |---|---|
            | `json:/pointer` | the string at an RFC 6901 pointer in the JSON response body (a body that is not JSON, or a pointer to something that is not a string, is `not_a_string`) |
            | `header:Name` | the value of a response header, name in any letter case; it must occur exactly once |
            | `cookie:name` | the value of the cookie `name` in the `Set-Cookie` headers; it must occur exactly once, and only the value is taken, not the attributes |

            May not contain `{{`.
        as:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
          description: The session name, used as `{{session:NAME}}`. Used once per request.
        ttl_secs:
          type: integer
          minimum: 1
          description: Lifetime in seconds, at most the operator's `sessions.max_ttl_secs` (default 86400). Default is the operator's `sessions.default_ttl_secs` (1800).
    CaptureResult:
      type: object
      required: [as, status]
      description: What became of one `capture` entry. Never holds a value.
      properties:
        as:
          type: string
        status:
          type: string
          enum: [captured, not_found, not_a_string, ambiguous, too_short, too_long, expired, limit_reached]
          description: |
            `captured`: stored. `not_found`: nothing at the source. `not_a_string`: the JSON pointer points to something that is not a string, or the body is not JSON. `ambiguous`: more than one header or cookie of that name (or a JSON body that repeats a key). `too_short`: shorter than 4 characters. `too_long`: longer than 16384 bytes. `expired`: already past its own expiry. `limit_reached`: the key already holds the most live sessions the operator allows (`sessions.max_per_key`).
        expires_at:
          type: string
          format: date-time
          description: When the session expires. Only when `status` is `captured`.
    SessionInfo:
      type: object
      required: [name, host, expires_at]
      description: A live captured session of the calling key. Never its value.
      properties:
        name:
          type: string
        host:
          type: string
          description: The host the session is bound to, with `:port` when the port is not the default for the scheme.
        expires_at:
          type: string
          format: date-time
    ProxyRequest:
      type: object
      additionalProperties: false
      required: [method, url]
      description: |
        The request Ferrowarden should make for the agent, with placeholders where credentials belong.

        **Placeholder grammar.** A placeholder is `{{vault:NAME}}` or `{{vault:NAME:SELECTOR}}`, or `{{session:NAME}}` for a captured session (below):

        | Placeholder | Substitutes |
        |---|---|
        | `{{vault:NAME}}` | the item's password |
        | `{{vault:NAME:password}}` | the password, written out |
        | `{{vault:NAME:username}}` | the login username |
        | `{{vault:NAME:totp}}` | the current TOTP code |
        | `{{vault:NAME:notes}}` | the item's notes |
        | `{{vault:NAME:field:FIELD}}` | a custom field (text, hidden, boolean, or linked to the username or password) |

        `NAME` and `FIELD` are either a plain word of letters, digits, `_`, `-` and `.`, or a single-quoted string that can hold any characters, such as spaces and colons. Inside quotes write `\'` for a quote and `\\` for a backslash. An empty name is not valid. Names are case-sensitive and must match the vault item exactly. Examples: `{{vault:example_api_token}}`, `{{vault:'Example Service (prod)':username}}`, `{{vault:'Example Service (prod)':field:'api secret'}}`. `listCredentials` with `detail=true` returns ready-made placeholders, so you rarely need to write the quoting yourself.

        **Where placeholders may appear.** In the URL's path, query string or user info (not its scheme, host or port); in any header value; and in the body, inside string values and object keys of a JSON body or anywhere in a string body. A placeholder that would change the URL's scheme, host or port is rejected with `400`. The same placeholder may appear several times, and different placeholders may be mixed in one request.

        **Sessions.** `{{session:NAME}}` is replaced with a value captured earlier from a login response (`capture` in `ForwardPayload`). `NAME` is a plain word of 1 to 64 letters, digits, `_`, `-` and `.`, without quotes. It works in the same places as a vault placeholder, and only for requests to the origin (scheme, host and port) the session was captured from, by the agent key that captured it. A name that is not there, has expired or belongs to another key is `422`; another origin is `403`. A session placeholder is not matched against the key's credential patterns.

        **Malformed placeholders.** Anything that starts with `{{vault:` or `{{session:` and does not parse is rejected with `422`, and the request is not forwarded. A placeholder that parses but names a credential or field that does not exist is also `422`.

        **Policy.** The agent key's policy decides which credentials a placeholder may name and which methods may be used. Each credential can be sent only to the hosts it is bound to in the vault.
      properties:
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
          description: The HTTP method. The server accepts any letter case and normalises it to upper case. Other methods, including `TRACE` and `CONNECT`, are rejected with `400` for every key.
        url:
          type: string
          description: The target URL. Only `http` and `https` are accepted. Placeholders are allowed in the path, query and user info.
        headers:
          type: object
          description: Headers to send to the target. Names that differ only by letter case count as duplicates and are rejected. Headers whose names start with `x-fw-` are dropped before the request is sent.
          additionalProperties:
            type: string
        body:
          description: |
            The request body. A JSON string is sent as it is (a raw text body, such as form data). Any other JSON value (object, array, number or boolean) is serialised and sent as JSON, with `Content-Type: application/json` added if you did not set that header. `null` or leaving it out sends no body.
    ProxyResponse:
      type: object
      required: [status, headers, body, body_encoding]
      description: |
        The target's response, after scrubbing.

        **Scrubbing.** Ferrowarden replaces the credential values it substituted into this request with `[REDACTED]`, wherever they appear in the response body or in header values, in their raw, JSON-escaped, URL-encoded and four common base64 forms. Every captured session value of the calling key gets the same treatment whether or not the request used it, and is replaced with `[CAPTURED:NAME]`. Usernames, TOTP codes and boolean fields are not matched by value, and neither is a value shorter than 4 characters. Ferrowarden also redacts common credential shapes: bearer tokens, JSON fields named like `api_key`, `secret` or `password`, PEM private key blocks, passwords in `http(s)://user:pass@` URLs and Proxmox API tokens. Scrubbing is best effort. A target that transforms a value in some other way before echoing it back is not covered, and the patterns can redact text that is not a credential.

        Hop-by-hop headers and `content-length` are left out of `headers`, and so are header values that are not valid text. A response larger than the operator's limit (`max_response_bytes`, 10 MiB by default) is refused with `502` instead.
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code the target returned.
        headers:
          type: object
          description: The target's response headers, with lower-case names and scrubbed values.
          additionalProperties:
            type: string
        body:
          type: string
          description: The target's response body, scrubbed. JSON from the target stays a string and is not parsed. See `body_encoding`.
        body_encoding:
          type: string
          enum: [utf8, base64]
          description: "`utf8` when `body` is the response text. `base64` when the response was not valid UTF-8 and `body` is its base64 encoding (scrubbed before encoding)."
        captures:
          type: array
          description: What became of each `capture` entry of the request, in request order. Left out when the request had none.
          items:
            $ref: "#/components/schemas/CaptureResult"
    CredentialPatterns:
      type: array
      maxItems: 256
      description: |
        Credential name patterns, matched against the item name (after unquoting a placeholder). `*` is the only wildcard and matches any run of characters, including none. A pattern must match the whole name, and matching is case-sensitive. There is no escaping: `?`, `[` and `.` are literal. `["*"]` allows every credential and `[]` allows none. `null` is rejected. A list that contains `*` is stored as `["*"]`, and duplicates are removed.
      items:
        type: string
        minLength: 1
        maxLength: 256
        description: A pattern, without control characters.
    ApprovalPatterns:
      type: array
      maxItems: 256
      description: |
        Credential name patterns that need a human's approval before this key can use them, with the same syntax, limits and matching as `credentials`. `["*"]` requires approval for every credential and `[]` adds no requirement (the default, and what a key from before approvals existed has). This is an extra requirement only: a vault item that carries a `ferrowarden_approval` field needs approval whatever this list says. `null` is rejected. Removing or narrowing a pattern gives the key more access, so the admin UI asks for confirmation.
      items:
        type: string
        minLength: 1
        maxLength: 256
        description: A pattern, without control characters.
    CreatePatterns:
      type: array
      maxItems: 256
      description: |
        Credential name patterns this key may ask Ferrowarden to **create** in the managed collection, with the same syntax, limits and matching as `credentials`. `["*"]` allows any name and `[]` allows none (the default, and what a key from before creating existed has). It is its own permission: it is independent of `credentials` and `methods`. `null` is rejected. Adding or broadening a pattern gives the key more access, so the admin UI asks for confirmation.
      items:
        type: string
        minLength: 1
        maxLength: 256
        description: A pattern, without control characters.
    CreateCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, uris, generate]
      description: The body of `createCredential`. `null` is rejected for every field.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: The credential's name, as it will be written in a placeholder. No control characters, and the key's `create` patterns must match it.
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: The login username, if the service has one.
        uris:
          type: array
          minItems: 1
          maxItems: 16
          description: The URLs the credential is for (its host bindings). Each must be an absolute `http` or `https` URL without a username or password, and must pass the outbound target policy, so a credential can only be created for places Ferrowarden may reach anyway.
          items:
            type: string
            maxLength: 2048
        generate:
          $ref: "#/components/schemas/GenerateOptions"
        approval_required:
          type: boolean
          default: false
          description: When true the new item carries a `ferrowarden_approval` field, so every later use of it needs a human's approval too.
    GenerateOptions:
      type: object
      additionalProperties: false
      description: How the password is generated.
      properties:
        length:
          type: integer
          minimum: 16
          maximum: 128
          default: 32
          description: Characters in the password.
        charset:
          type: string
          enum: [alphanumeric, ascii, hex, base64url]
          default: alphanumeric
          description: |
            `alphanumeric` is `A-Z a-z 0-9`. `ascii` is letters, digits and `-_.~!@#%^*+=:,`, a set without the characters that most often need quoting (quotes, backslash, `$`, backtick, space, `&`, `;`, `|`, `<`, `>`); the value still has to be quoted or encoded where `*`, `!`, `#` or `%` matter. `hex` is `0-9 a-f`. `base64url` is `A-Z a-z 0-9 - _` (without padding). Every character is chosen uniformly at random.
    CreateCredentialResponse:
      type: object
      required: [name, placeholder, cache_refreshed]
      description: The new credential. There is no value in it.
      properties:
        name:
          type: string
        placeholder:
          type: string
          description: The placeholder for the password, quoted when the name needs it. Paste it into a request as it is.
        cache_refreshed:
          type: boolean
          description: "`false` when the item was written but the credential cache could not be refreshed afterwards: the placeholder works once the next refresh has run."
    RotatePatterns:
      type: array
      maxItems: 256
      description: |
        Credential name patterns this key may ask Ferrowarden to **rotate** in the managed collection, with the same syntax, limits and matching as `credentials`. `["*"]` allows any name and `[]` allows none (the default, and what a key from before rotating existed has). It is its own permission: it is independent of `create`, `credentials` and `methods`, and it only ever applies to items in the managed collection. `null` is rejected. Adding or broadening a pattern gives the key more access, so the admin UI asks for confirmation.
      items:
        type: string
        minLength: 1
        maxLength: 256
        description: A pattern, without control characters.
    RotateCredentialRequest:
      type: object
      additionalProperties: false
      description: The optional body of `rotateCredential`. `null` is rejected.
      properties:
        generate:
          $ref: "#/components/schemas/GenerateOptions"
    RotationFinishRequest:
      type: object
      required: [rotation_id]
      additionalProperties: false
      description: "The body of a commit or an abort: the rotation it finishes."
      properties:
        rotation_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: "The `rotation_id` the start returned (or the detailed listing shows). The write is made only if the pending value on the item is the one it names."
    RotateStarted:
      type: object
      required: [name, current, next, rotation_id]
      description: A rotation was started. There is no value in it.
      properties:
        name:
          type: string
        current:
          type: string
          description: The placeholder for the current password, which is unchanged until the rotation is committed.
        next:
          type: string
          description: The placeholder for the new, pending password. It works only while the rotation is pending.
        rotation_id:
          type: string
          description: "Identifies exactly this rotation (a random identifier). Send it back to commit or abort this rotation; a request that names another rotation is refused and writes nothing."
    RotateFinished:
      type: object
      required: [name, placeholder]
      description: A rotation was committed or aborted. There is no value in it.
      properties:
        name:
          type: string
        placeholder:
          type: string
          description: The placeholder for the password (the new one after a commit).
    RotateApproval:
      type: object
      required: [name, generate, collection]
      description: What a `rotate` approval is for. Present on `rotate` approvals only.
      properties:
        name:
          type: string
        generate:
          type: object
          required: [charset, length]
          properties:
            charset:
              type: string
              enum: [alphanumeric, ascii, hex, base64url]
            length:
              type: integer
        collection:
          type: string
          description: The name of the managed collection the item is in.
    MethodList:
      type: array
      maxItems: 256
      description: |
        Allowed HTTP methods. `["*"]` allows all seven and `[]` allows none. `*` together with other entries is rejected as ambiguous. `null` is rejected. Input is case-insensitive. Responses list the methods in upper case, in the order `GET`, `HEAD`, `POST`, `PUT`, `PATCH`, `DELETE`, `OPTIONS`.
      items:
        type: string
        enum: ["*", GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    KeyPolicy:
      type: object
      description: |
        What an agent key may do. A policy has no default: a key must be given both lists, and a key without a policy (created with 0.1.0) is deny-all until one is set. `["*"]` means everything and `[]` means nothing in both lists. `null` is never accepted.
      required: [credentials, methods, approval, create, rotate]
      properties:
        credentials:
          $ref: "#/components/schemas/CredentialPatterns"
        methods:
          $ref: "#/components/schemas/MethodList"
        approval:
          $ref: "#/components/schemas/ApprovalPatterns"
        create:
          $ref: "#/components/schemas/CreatePatterns"
        rotate:
          $ref: "#/components/schemas/RotatePatterns"
    CreateKeyRequest:
      type: object
      additionalProperties: false
      required: [name, credentials, methods]
      description: The body of `createKey`. `credentials` and `methods` are required; `approval`, `create` and `rotate` are optional and default to `[]`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A name for the agent, for example `homelab-claude`. Surrounding whitespace is removed, and the server limits the trimmed name to 128 bytes.
        credentials:
          $ref: "#/components/schemas/CredentialPatterns"
        methods:
          $ref: "#/components/schemas/MethodList"
        approval:
          $ref: "#/components/schemas/ApprovalPatterns"
        create:
          $ref: "#/components/schemas/CreatePatterns"
        rotate:
          $ref: "#/components/schemas/RotatePatterns"
    CreateKeyResponse:
      type: object
      required: [id, name, token, created_at, credentials, methods, approval, create, rotate, policy_set]
      description: The new key. `token` appears here and nowhere else.
      properties:
        id:
          type: string
          description: The key id, used in the other key operations and in security events.
        name:
          type: string
        token:
          type: string
          description: The agent key value to put in `X-Agent-Key`. Store it now. It cannot be retrieved later.
        created_at:
          type: string
          format: date-time
        credentials:
          $ref: "#/components/schemas/CredentialPatterns"
        methods:
          $ref: "#/components/schemas/MethodList"
        approval:
          $ref: "#/components/schemas/ApprovalPatterns"
        create:
          $ref: "#/components/schemas/CreatePatterns"
        rotate:
          $ref: "#/components/schemas/RotatePatterns"
        policy_set:
          type: boolean
          description: Always `true` for a key created through the API.
    KeySummary:
      type: object
      required: [id, name, created_at, credentials, methods, approval, create, rotate, policy_set]
      description: An agent key without its token.
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        credentials:
          $ref: "#/components/schemas/CredentialPatterns"
        methods:
          $ref: "#/components/schemas/MethodList"
        approval:
          $ref: "#/components/schemas/ApprovalPatterns"
        create:
          $ref: "#/components/schemas/CreatePatterns"
        rotate:
          $ref: "#/components/schemas/RotatePatterns"
        policy_set:
          type: boolean
          description: "`false` for a key created with 0.1.0 that has no policy yet. It is deny-all (`[]` and `[]`) until a policy is set with `updateKeyPolicy`."
    PatchKeyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The body of `updateKeyPolicy`. At least one field is required. A field that is left out is unchanged, and `null` is rejected.
      properties:
        credentials:
          $ref: "#/components/schemas/CredentialPatterns"
        methods:
          $ref: "#/components/schemas/MethodList"
        approval:
          $ref: "#/components/schemas/ApprovalPatterns"
        create:
          $ref: "#/components/schemas/CreatePatterns"
        rotate:
          $ref: "#/components/schemas/RotatePatterns"
    PreviewRequest:
      type: object
      additionalProperties: false
      description: The body of `previewKeyPolicy`. Every field is optional. A policy field that is left out means the key's saved value, and `null` is rejected.
      properties:
        credentials:
          $ref: "#/components/schemas/CredentialPatterns"
        methods:
          $ref: "#/components/schemas/MethodList"
        approval:
          $ref: "#/components/schemas/ApprovalPatterns"
        create:
          $ref: "#/components/schemas/CreatePatterns"
        rotate:
          $ref: "#/components/schemas/RotatePatterns"
        request:
          $ref: "#/components/schemas/ProxyRequest"
    ApprovalNeed:
      type: object
      required: [credential, reasons]
      description: One credential that needs a human's approval, and why.
      properties:
        credential:
          $ref: "#/components/schemas/CredentialName"
        reasons:
          type: array
          description: "`vault_field`: the vault item carries a `ferrowarden_approval` field. `key_policy`: the key's `approval` patterns match the name. Either is enough, and a key's policy can never exempt an item that has the field."
          items:
            type: string
            enum: [vault_field, key_policy]
    PreviewResponse:
      type: object
      required: [key, saved_policy, draft_policy, credentials, gained, lost, approval_required]
      description: What a draft policy would allow. Nothing is saved, no credential value is read and nothing is sent.
      properties:
        key:
          type: object
          required: [id, name, policy_set]
          properties:
            id:
              type: string
            name:
              type: string
            policy_set:
              type: boolean
        saved_policy:
          $ref: "#/components/schemas/KeyPolicy"
        draft_policy:
          $ref: "#/components/schemas/KeyPolicy"
        credentials:
          type: array
          description: The credentials the draft policy reaches, in the format of `listCredentials` with `detail=true`.
          items:
            $ref: "#/components/schemas/CredentialDetail"
        gained:
          type: array
          description: Credential names the draft reaches and the saved policy does not.
          items:
            $ref: "#/components/schemas/CredentialName"
        lost:
          type: array
          description: Credential names the saved policy reaches and the draft does not.
          items:
            $ref: "#/components/schemas/CredentialName"
        approval_required:
          type: array
          description: The credentials the draft reaches that would need a human's approval, and why. A preview never creates an approval request.
          items:
            $ref: "#/components/schemas/ApprovalNeed"
        request_check:
          $ref: "#/components/schemas/RequestCheck"
    RequestCheck:
      description: |
        The verdict on the `request` of a preview, present only when a request was supplied. It runs the checks of `forwardRequest` in the same order: request validation, placeholder parsing, method policy, credential scope, the outbound target policy (by name and IP literal only), then unknown, ambiguous and re-prompt items, missing values or fields, and host binding.
      oneOf:
        - type: object
          title: Allowed
          required: [allowed, approval, note]
          properties:
            allowed:
              const: true
            approval:
              type: array
              description: The credentials of this request that would need a human's approval, and why. Empty when none does. A preview never asks for an approval.
              items:
                $ref: "#/components/schemas/ApprovalNeed"
            note:
              $ref: "#/components/schemas/RequestCheckNote"
        - type: object
          title: Refused
          required: [allowed, status, reason, message, note]
          properties:
            allowed:
              const: false
            status:
              type: integer
              description: The HTTP status `forwardRequest` would answer with.
            reason:
              $ref: "#/components/schemas/ReasonCode"
            message:
              type: string
              description: The error message `forwardRequest` would return.
            note:
              $ref: "#/components/schemas/RequestCheckNote"
    RequestCheckNote:
      type: string
      description: A fixed reminder that the target host is checked by name and IP literal only. The private-address check on a resolved DNS name happens only when a request is really forwarded.
    PendingApproval:
      type: object
      required: [id, kind, key, credentials, request_id, created_at, expires_at]
      description: |
        An approval waiting for a decision. A `forward` approval shows the request as the agent sent it (placeholders, never values), has `method`, `origin` and `url`, and approving it gives a grant. A `create` approval shows what the agent asked to have created, in `create`, has no method, origin or URL, and allows exactly one operation. A `rotate` approval shows which credential's password the agent asked to rotate, in `rotate`, and is the same kind of one-operation approval. There is never a value in any of them: a create's or a rotation's password has not been generated yet.
      properties:
        id:
          type: string
          description: "An unguessable id. It is not a capability, so knowing it decides nothing: deciding needs the admin key here, or a signed-in session in the UI."
        kind:
          type: string
          enum: [forward, create, rotate]
          description: "`forward`: use credentials that need approval (approving gives a grant for a chosen duration). `create`: create a credential. `rotate`: rotate a credential's password. Approving a `create` or a `rotate` allows that one operation, once, and has no duration."
        create:
          $ref: "#/components/schemas/CreateApproval"
        rotate:
          $ref: "#/components/schemas/RotateApproval"
        key:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        credentials:
          type: array
          items:
            type: object
            required: [credential, reasons]
            properties:
              credential:
                $ref: "#/components/schemas/CredentialName"
              reasons:
                type: array
                items:
                  type: string
                  enum: [vault_field, key_policy]
        method:
          type: string
        origin:
          $ref: "#/components/schemas/ApprovalOrigin"
        url:
          type: string
          description: The URL as the agent sent it, with placeholders, truncated to 2048 characters.
        request_id:
          type: string
          description: The request id of the forward request that opened the approval.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the approval stops being open if nobody decides. A denial stands for the same length of time.
    CreateApproval:
      type: object
      required: [name, uris, generate, approval_required, collection]
      description: What a `create` approval is for. Present on `create` approvals only.
      properties:
        name:
          type: string
        username:
          type: [string, "null"]
        uris:
          type: array
          description: The URLs, sorted.
          items:
            type: string
        generate:
          type: object
          required: [charset, length]
          properties:
            charset:
              type: string
              enum: [alphanumeric, ascii, hex, base64url]
            length:
              type: integer
        approval_required:
          type: boolean
          description: The new item will need approval on every use.
        collection:
          type: string
          description: The name of the managed collection the item will be written to.
    ApprovalOrigin:
      type: object
      required: [scheme, host, port]
      description: The target a grant covers.
      properties:
        scheme:
          type: string
        host:
          type: string
          description: The host, with `:port` when the port is not the scheme's default.
        port:
          type: integer
    ApprovalGrant:
      type: object
      required: [id, approval_id, key, credentials, origin, approver, created_at, expires_at]
      description: A live grant. It covers one agent key, the listed credentials and one origin until it ends, whatever the request. In memory only, so a restart, a key revocation or policy change, or the vault locking ends it.
      properties:
        id:
          type: string
        approval_id:
          type: string
        key:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialName"
        origin:
          $ref: "#/components/schemas/ApprovalOrigin"
        approver:
          type: string
          description: "Who approved: `admin_api` for the admin API, the signed-in vault account for the UI."
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    ApprovalList:
      type: object
      required: [pending, grants]
      properties:
        pending:
          type: array
          description: Open approvals, oldest first.
          items:
            $ref: "#/components/schemas/PendingApproval"
        grants:
          type: array
          description: Live grants, soonest to end first.
          items:
            $ref: "#/components/schemas/ApprovalGrant"
    ApproveRequest:
      type: object
      additionalProperties: false
      required: [minutes]
      description: The body of `approveApproval` for a `forward` approval. There is no default length. A `create` or `rotate` approval takes no body (an empty body or `{}`); a `minutes` there is a `400`.
      properties:
        minutes:
          type: integer
          minimum: 1
          description: How long the grant lasts, from 1 to the operator's `approval.max_grant_minutes` (480 by default).
    ApproveResponse:
      type: object
      required: [status, kind]
      description: The answer of `approveApproval`. A `forward` approval answers with its grant; a `create` or `rotate` approval has none.
      properties:
        status:
          type: string
          const: approved
        kind:
          type: string
          enum: [forward, create, rotate]
        grant:
          $ref: "#/components/schemas/ApprovalGrant"
    DecisionResponse:
      type: object
      required: [status, id]
      properties:
        status:
          type: string
          enum: [denied, revoked]
        id:
          type: string
    UnlockRequest:
      type: object
      additionalProperties: false
      required: [password]
      description: The body of `unlockVault`.
      properties:
        password:
          type: string
          format: password
          description: The vault master password. It is used once to unlock the vault backend and is cleared from memory afterwards.
    UnlockResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: unlocked
    RevokeKeyResponse:
      type: object
      required: [status, id]
      properties:
        status:
          type: string
          const: revoked
        id:
          type: string
          description: The id of the revoked key.
    Status:
      type: object
      required: [locked, vault_backend, credential_count, agent_key_count, managed_collection]
      description: Operational status.
      properties:
        managed_collection:
          type: object
          required: [configured, usable]
          description: "The managed collection (`vault.managed.collection`), where agents may create credentials. No secrets."
          properties:
            configured:
              type: boolean
              description: "`vault.managed.collection` is set. When it is not, creating credentials is off."
            usable:
              type: boolean
              description: The collection can be written to (it exists, the account has Can edit and does not have Hide passwords, and its organisation key is available).
            id:
              type: string
              description: The collection's id, when usable.
            name:
              type: string
              description: The collection's name, when usable.
            items:
              type: integer
              description: How many readable vault items are in it, when usable.
            setting:
              type: string
              description: What the operator configured, when it is not usable.
            reason:
              type: string
              description: Why it is not usable (`not_found`, `read_only`, `hides_passwords`, `ambiguous_name`, `no_organization_key`, or `vault_locked`).
            message:
              type: string
        locked:
          type: boolean
          description: Whether the vault is locked.
        vault_backend:
          type: string
          enum: [native]
          description: The vault backend in use (`vault.backend`). Always `native`; the field stays so that dashboards and SIEM rules keep working.
        credential_count:
          type: integer
          minimum: 0
          description: The number of credential names in the cache. Distinct names, not vault items.
        agent_key_count:
          type: integer
          minimum: 0
          description: The number of active agent keys.
    NotifyTestResponse:
      type: object
      required: [results]
      description: The outcome of `sendTestNotification`.
      properties:
        results:
          type: array
          description: One entry per enabled notifier, in the order gotify, ntfy, webhook. Empty when none is configured.
          items:
            $ref: "#/components/schemas/NotifyTestResult"
    NotifyTestResult:
      type: object
      required: [sender, ok]
      properties:
        sender:
          type: string
          enum: [gotify, ntfy, webhook]
        ok:
          type: boolean
          description: Whether the notifier accepted the notification (a 2xx answer).
        status:
          type: integer
          description: The HTTP status the notifier answered with. Absent when it did not answer.
        error:
          type: string
          description: Why it failed, in fixed words. Absent when `ok` is true.
    ReasonCode:
      type: string
      description: A fixed code that explains a failure. New codes may be added over time, so treat an unknown value as a generic failure.
      enum:
        - missing_key
        - invalid_key
        - missing_admin_key
        - invalid_admin_key
        - rate_limited
        - invalid_json
        - invalid_request
        - target_blocked
        - invalid_target_url
        - credential_host_not_allowed
        - credential_out_of_scope
        - method_not_allowed
        - reprompt_required
        - unknown_credential
        - ambiguous_credential
        - ambiguous_field
        - malformed_placeholder
        - vault_locked
        - upstream_error
        - response_too_large
        - key_not_found
        - unlock_failed
        - sync_failed
        - internal_error
        - invalid_credentials
        - two_factor_required
        - two_factor_failed
        - login_locked_out
        - upstream_rate_limited
        - insecure_transport
        - missing_metrics_token
        - invalid_metrics_token
        - unknown_session
        - session_host_not_allowed
        - sessions_disabled
        - capture_failed
        - approval_pending
        - approval_denied
        - approval_limit_reached
        - credential_exists
        - managed_collection_unavailable
        - credential_create_disabled
        - credential_create_out_of_scope
        - vault_write_failed
        - vault_write_unknown
        - rotation_mismatch
    SecurityEvent:
      type: object
      description: |
        One security event (`schema_version` 1), with ECS-style field names. Fields that do not apply are omitted rather than set to `null`. No field holds a credential value, a token or the master password. New fields, actions and reason codes may be added within a schema version, so parse tolerantly. See `docs/events.md`.
      required: ["@timestamp", message, event, service, ferrowarden]
      properties:
        "@timestamp":
          type: string
          format: date-time
          description: UTC, RFC 3339 with milliseconds.
        message:
          type: string
          description: A short summary built from fixed text.
        event:
          type: object
          required: [kind, dataset, action, category, type, outcome]
          properties:
            kind:
              type: string
              const: event
            dataset:
              type: string
              const: ferrowarden.security
            action:
              type: string
              description: What happened.
              enum:
                - forward
                - credentials_list
                - agent_auth
                - admin_auth
                - rate_limited
                - request_rejected
                - key_create
                - key_revoke
                - key_list
                - key_policy_change
                - policy_preview
                - audit_read
                - status_read
                - openapi_read
                - vault_unlock
                - vault_lock
                - vault_sync
                - startup
                - shutdown
                - events_dropped
                - ui_login
                - ui_logout
                - ui_session_expired
                - ui_two_factor_email_sent
                - notify_test
                - metrics_auth
                - session_capture
                - session_use
                - session_expire
                - session_delete
                - approval_requested
                - approval_granted
                - approval_denied
                - approval_expired
                - grant_revoked
                - grant_expired
            category:
              type: array
              items:
                type: string
                enum: [web, authentication, network, iam, configuration]
            type:
              type: array
              items:
                type: string
                enum: [access, denied, start, end, change, creation, deletion, info]
            outcome:
              type: string
              enum: [success, failure, unknown]
            reason:
              $ref: "#/components/schemas/ReasonCode"
            duration:
              type: integer
              minimum: 0
              description: Nanoseconds. Only on `forward` events.
        source:
          type: object
          required: [ip]
          properties:
            ip:
              type: string
              description: The client IP address.
        http:
          type: object
          properties:
            request:
              type: object
              required: [method]
              properties:
                method:
                  type: string
            response:
              type: object
              required: [status_code]
              properties:
                status_code:
                  type: integer
                body:
                  type: object
                  description: Only on successful `forward` events.
                  required: [bytes]
                  properties:
                    bytes:
                      type: integer
                      minimum: 0
                      description: Size in bytes of the upstream response body, before scrubbing. A size, never content.
        url:
          type: object
          required: [original]
          properties:
            original:
              type: string
              description: The URL as the agent sent it, before substitution (placeholders, not values), truncated to 2048 characters.
            domain:
              type: string
        service:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              const: ferrowarden
            version:
              type: string
        ferrowarden:
          type: object
          required: [schema_version]
          properties:
            schema_version:
              type: integer
              const: 1
            request_id:
              type: string
              description: The `X-Request-Id` of the request that produced the event.
            key:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            credentials:
              type: array
              description: Labels of the placeholders the request used. Not values.
              items:
                type: string
            sessions:
              type: array
              description: Names of the captured sessions the request used (`{{session:NAME}}`). Not values.
              items:
                type: string
            details:
              type: object
              description: A small object that depends on the action. Its keys are listed in `docs/events.md`.
              additionalProperties: true
