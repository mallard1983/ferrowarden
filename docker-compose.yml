# docker-compose.yml
#
# Ferrowarden production stack: Vaultwarden + bw serve + Ferrowarden
#
# BEFORE FIRST RUN:
#   1. Generate secrets (see the secrets section at the bottom).
#   2. Generate a TLS certificate (see docs/setup.md Step 0).
#   3. Start Vaultwarden alone and register your account via its web UI:
#        docker compose up -d vaultwarden
#        # Temporarily add ports: ["127.0.0.1:8080:80"] to vaultwarden to access the UI
#   4. Create an API key in Vaultwarden (Account Settings → API Key).
#      Write the client_id and client_secret to secrets/bw_client_id and
#      secrets/bw_client_secret.
#   5. Bring up the full stack:
#        docker compose up -d
#
# See docs/setup.md for the complete step-by-step guide.

services:

  # ── Vaultwarden ─────────────────────────────────────────────────────────────
  # Self-hosted Bitwarden-compatible server. Handles encrypted credential
  # storage and the human-facing web vault UI for managing credentials.
  # Ferrowarden itself never talks directly to Vaultwarden — only bw serve does.
  vaultwarden:
    # Pinned: bw CLI 2023.12.1 (see docker/bw-cli.Dockerfile) is verified
    # against this release. Upgrade both deliberately and re-run the tests.
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    volumes:
      - vaultwarden-data:/data
    environment:
      # Set to the URL you use to reach Vaultwarden in a browser.
      # Required for email verification links to work correctly.
      # If you are not exposing Vaultwarden externally, the internal URL is fine.
      DOMAIN: "http://vaultwarden:80"
      # Disable signups once your account is created. Anyone with network
      # access to the Vaultwarden port could otherwise register an account.
      SIGNUPS_ALLOWED: "false"
    networks:
      - vault-internal
    # Vaultwarden is on the internal network only. To access the web UI for
    # credential management, temporarily add a port mapping here and remove
    # it when done:
    #   ports:
    #     - "127.0.0.1:8080:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── bw serve ────────────────────────────────────────────────────────────────
  # The Bitwarden CLI running in server mode. Provides a local REST API that
  # ferrowarden uses to list credentials and retrieve values.
  #
  # Why bw serve instead of direct Vaultwarden API calls?
  # Vaultwarden's vault items are end-to-end encrypted with the master password.
  # bw serve handles decryption locally — no raw credential values travel over
  # the network at any point.
  bw-serve:
    build:
      context: ./docker
      dockerfile: bw-cli.Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/bw-entrypoint.sh:/entrypoint.sh:ro
      # Persist the bw local vault cache across restarts. The node user can
      # write here because the Dockerfile creates and chowns this directory
      # before the USER switch, so Docker copies that ownership to the volume.
      - bw-data:/home/node/.config/Bitwarden CLI
    secrets:
      - bw_client_id
      - bw_client_secret
    environment:
      BW_SERVER_URL: "http://vaultwarden:80"
      BW_SERVE_HOSTNAME: "0.0.0.0"
      BW_SERVE_PORT: "8087"
    networks:
      - vault-internal
    # bw serve takes ~15–20 seconds to log in and sync before the HTTP API is
    # ready. The healthcheck polls /status so ferrowarden can wait for the real
    # ready signal instead of a fixed sleep.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/status"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    # bw serve port is intentionally NOT exposed to the host.
    # Only ferrowarden (on vault-internal) can reach it.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Ferrowarden ─────────────────────────────────────────────────────────────
  # The credential proxy. Agents send API calls here with {{vault:name}}
  # placeholders; ferrowarden substitutes real values, forwards the call,
  # and returns the scrubbed response. Credential values never reach the agent.
  ferrowarden:
    build: .
    restart: unless-stopped
    secrets:
      - ferrowarden_admin_key
      - bw_master_password
    volumes:
      # TLS certificate and private key. Generate before first start.
      # See docs/setup.md Step 0 or scripts/dev-setup.ps1 / dev-setup.sh.
      - ./certs/server.crt:/run/certs/server.crt:ro
      - ./certs/server.key:/run/certs/server.key:ro
      # Persistent agent key store. Only SHA-256 hashes are written — plaintext
      # tokens are never stored on disk. Keys survive container restarts and
      # can be rotated via the admin API without shell access.
      - ferrowarden-keys:/data
    environment:
      FERROWARDEN_UNLOCK_MODE: "file"
      FERROWARDEN_UNLOCK_FILE: "/run/secrets/bw_master_password"
      FERROWARDEN_BW_SERVE_URL: "http://bw-serve:8087"
      FERROWARDEN_BIND_ADDR: "0.0.0.0:3000"
      # Admin key is read from Docker secret by the entrypoint script.
      FERROWARDEN_ADMIN_KEY_FILE: "/run/secrets/ferrowarden_admin_key"
      FERROWARDEN_TLS_ENABLED: "true"
      FERROWARDEN_TLS_CERT_FILE: "/run/certs/server.crt"
      FERROWARDEN_TLS_KEY_FILE: "/run/certs/server.key"
      # Persist agent keys across restarts (SHA-256 hashes only, never plaintext).
      FERROWARDEN_KEYS_FILE: "/data/agent_keys.json"
      # Log level. Valid values: trace, debug, info, warn, error.
      # Module-scoped: "ferrowarden=debug,tower_http=warn"
      # Changing this requires a container restart — intentional, see docs/logging.md.
      FERROWARDEN_LOG_LEVEL: "info"
      # Outbound target policy. Private/internal addresses are blocked by
      # default; list the internal hosts or ranges agents need to reach
      # (comma-separated CIDRs, IPs or host names). bw serve is always blocked.
      # FERROWARDEN_ALLOWED_TARGETS: "192.168.1.0/24,proxmox.lan"
      # Credentials are only sent to hosts listed in their vault item's URIs.
      # Leave this on; see docs/security.md before changing it.
      FERROWARDEN_ENFORCE_CREDENTIAL_HOSTS: "true"
      # If a reverse proxy (e.g. Pangolin) sits in front of ferrowarden, set its
      # address so rate limiting uses the real client IP from X-Forwarded-For.
      # FERROWARDEN_TRUSTED_PROXIES: "172.16.0.0/12"
    networks:
      - vault-internal
      - agent-facing
    ports:
      # Bound to all interfaces so agents on other hosts can connect over TLS.
      # TLS is required (default) whenever this port is reachable over a network.
      # Change to 127.0.0.1:3000:3000 if the agent runs on the same host only.
      - "0.0.0.0:3000:3000"
    depends_on:
      bw-serve:
        # Wait for bw serve to pass its healthcheck before starting ferrowarden.
        # Without this, ferrowarden's file-mode unlock races against bw serve init
        # and fails with "connection refused" on the first boot.
        condition: service_healthy
    healthcheck:
      # Uses the public /health endpoint (no auth required).
      # -k accepts the self-signed TLS cert for the local health check.
      test: ["CMD", "curl", "-f", "-k", "https://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Log rotation: keeps logs on disk bounded. Each log file caps at 50 MB;
    # up to 10 files are kept (500 MB max per service).
    # For Loki or Wazuh integration, see docs/logging.md.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"


# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Internal network for vault communication. Vaultwarden, bw-serve, and
  # ferrowarden can reach each other here. Nothing outside Docker can.
  vault-internal:
    driver: bridge
    internal: true

  # Network ferrowarden uses to accept agent connections and make outbound
  # API calls to target services. Not internal.
  agent-facing:
    driver: bridge


# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  # Encrypted vault data. Back this up — it contains your credentials.
  vaultwarden-data:
  # bw CLI local vault cache. Persists across restarts so bw does not need
  # to re-sync on every container start.
  bw-data:
  # Agent key hashes. Allows keys to survive ferrowarden restarts.
  ferrowarden-keys:


# ── Secrets ──────────────────────────────────────────────────────────────────
# Create these files before running docker compose up.
# Each file contains only the secret value — no trailing newline.
#
# Linux/Mac:
#   mkdir -p secrets
#   echo -n "user.xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" > secrets/bw_client_id
#   echo -n "YourClientSecretHere"                       > secrets/bw_client_secret
#   echo -n "YourMasterPasswordHere"                     > secrets/bw_master_password
#   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 48 > secrets/ferrowarden_admin_key
#   chmod 600 secrets/*
#
# Windows (PowerShell):
#   New-Item -ItemType Directory -Force secrets
#   [IO.File]::WriteAllText("secrets\bw_client_id",           "user.xxxxxxxx-...", [Text.UTF8Encoding]::new($false))
#   [IO.File]::WriteAllText("secrets\bw_client_secret",       "YourClientSecretHere", [Text.UTF8Encoding]::new($false))
#   [IO.File]::WriteAllText("secrets\bw_master_password",     "YourMasterPasswordHere", [Text.UTF8Encoding]::new($false))
#   $k = -join ((65..90+97..122+48..57) | Get-Random -Count 48 | % { [char]$_ })
#   [IO.File]::WriteAllText("secrets\ferrowarden_admin_key",  $k, [Text.UTF8Encoding]::new($false))
secrets:
  bw_client_id:
    file: ./secrets/bw_client_id
  bw_client_secret:
    file: ./secrets/bw_client_secret
  bw_master_password:
    file: ./secrets/bw_master_password
  ferrowarden_admin_key:
    file: ./secrets/ferrowarden_admin_key
