# docker-compose.yml
#
# Ferrowarden production stack: Vaultwarden + bw serve + Ferrowarden
#
# BEFORE FIRST RUN:
#   1. Generate secrets (see the secrets section at the bottom).
#   2. Generate a TLS certificate (see docs/setup.md Step 0).
#   3. Optional: copy .env.example to .env and set where the Vaultwarden web
#      vault is published and the URL you reach it at.
#   4. Start Vaultwarden with signups enabled, just long enough to create
#      your account in the web vault (https://127.0.0.1:8443 by default):
#        VAULTWARDEN_SIGNUPS_ALLOWED=true docker compose up -d vaultwarden
#   5. In the web vault: Settings → Security → Keys → View API key. Write the
#      client_id and client_secret to secrets/bw_client_id and
#      secrets/bw_client_secret. Add Login items with URIs for your services.
#   6. Bring up the full stack (this also turns signups back off):
#        docker compose up -d
#
# The Vaultwarden web vault stays available afterwards: it is where you
# manage your passwords and the credentials agents use.
#
# See docs/setup.md for the complete step-by-step guide.

services:

  # ── Internal PKI (one-shot) ──────────────────────────────────────────────────
  # Creates a private CA and a certificate for "vaultwarden" in the
  # internal-pki volume. The Bitwarden CLI refuses plain-HTTP servers, so
  # Vaultwarden serves HTTPS on the internal network and bw serve trusts this
  # CA. Idempotent: re-issues the server cert only when missing or expiring.
  internal-certs:
    build:
      context: ./docker
      dockerfile: bw-cli.Dockerfile
    user: "0"
    entrypoint: ["/bin/sh", "/usr/local/bin/gen-internal-certs.sh"]
    volumes:
      - internal-pki:/pki
    environment:
      VW_HOSTNAME: "vaultwarden"
      # Extra names/IPs for the certificate, for browsing to the web vault
      # directly (e.g. "vault.lan,192.168.1.20"). Not needed behind a reverse
      # proxy that has its own certificate (e.g. Pangolin + Let's Encrypt).
      VW_EXTRA_SANS: "${VAULTWARDEN_CERT_SANS:-localhost,127.0.0.1}"
    network_mode: none
    restart: "no"

  # ── Vaultwarden ─────────────────────────────────────────────────────────────
  # Self-hosted Bitwarden-compatible server: your password manager. Its web
  # vault (and any Bitwarden app or browser extension) is where you store and
  # manage passwords, including the credentials agents use through
  # ferrowarden. Ferrowarden itself never talks to Vaultwarden — only bw
  # serve does, over the internal network.
  vaultwarden:
    # Pinned: bw CLI 2026.11.0 (see docker/bw-cli.Dockerfile) is verified
    # against this release. Upgrade both deliberately and re-run the tests.
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    volumes:
      - vaultwarden-data:/data
      - internal-pki:/pki:ro
    depends_on:
      internal-certs:
        condition: service_completed_successfully
    environment:
      # The URL you reach the web vault at (e.g. https://vault.example.com
      # behind a reverse proxy). Used for links, passkeys/WebAuthn and emails.
      DOMAIN: "${VAULTWARDEN_DOMAIN:-https://127.0.0.1:8443}"
      # Off except while creating your first account
      # (VAULTWARDEN_SIGNUPS_ALLOWED=true docker compose up -d vaultwarden).
      # Anyone who can reach the web vault could otherwise register.
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      # HTTPS with the internal CA's certificate: required because current
      # Bitwarden CLI releases refuse plain HTTP, and the web vault needs a
      # secure context.
      ROCKET_TLS: '{certs="/pki/vaultwarden.crt",key="/pki/vaultwarden.key"}'
      ROCKET_PORT: "443"
    networks:
      # vault-internal: reached by bw serve as https://vaultwarden.
      # vault-web: an ordinary bridge so the web vault can be published.
      - vault-internal
      - vault-web
    ports:
      # The web vault. Loopback by default; set VAULTWARDEN_PUBLISH=0.0.0.0
      # (in .env) for a reverse proxy or LAN clients — see docs/tls.md.
      - "${VAULTWARDEN_PUBLISH:-127.0.0.1}:${VAULTWARDEN_PORT:-8443}:443"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── bw serve ────────────────────────────────────────────────────────────────
  # The Bitwarden CLI running in server mode. Provides a local REST API that
  # ferrowarden uses to list credentials and retrieve values.
  #
  # Why bw serve instead of direct Vaultwarden API calls?
  # Vaultwarden's vault items are end-to-end encrypted with the master password.
  # bw serve handles decryption locally — no raw credential values travel over
  # the network at any point.
  bw-serve:
    build:
      context: ./docker
      dockerfile: bw-cli.Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/bw-entrypoint.sh:/entrypoint.sh:ro
      # Persist the bw local vault cache across restarts. The node user can
      # write here because the Dockerfile creates and chowns this directory
      # before the USER switch, so Docker copies that ownership to the volume.
      - bw-data:/home/node/.config/Bitwarden CLI
      # Internal CA certificate (trusted via NODE_EXTRA_CA_CERTS).
      - internal-pki:/pki:ro
    secrets:
      - bw_client_id
      - bw_client_secret
    environment:
      BW_SERVER_URL: "https://vaultwarden"
      # bw serve only accepts requests whose Host header is localhost or the
      # --hostname it was started with, so this must be the name ferrowarden
      # uses in FERROWARDEN_BW_SERVE_URL. It binds to this container's address
      # on vault-internal.
      BW_SERVE_HOSTNAME: "bw-serve"
      BW_SERVE_PORT: "8087"
    depends_on:
      internal-certs:
        condition: service_completed_successfully
    networks:
      - vault-internal
    # bw serve takes ~15–20 seconds to log in and sync before the HTTP API is
    # ready. The healthcheck polls /status so ferrowarden can wait for the real
    # ready signal instead of a fixed sleep.
    healthcheck:
      # Must use the bw-serve name: bw serve rejects other Host headers.
      test: ["CMD", "curl", "-f", "http://bw-serve:8087/status"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    # bw serve port is intentionally NOT exposed to the host.
    # Only ferrowarden (on vault-internal) can reach it.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Ferrowarden ─────────────────────────────────────────────────────────────
  # The credential proxy. Agents send API calls here with {{vault:name}}
  # placeholders; ferrowarden substitutes real values, forwards the call,
  # and returns the scrubbed response. Credential values never reach the agent.
  ferrowarden:
    build: .
    restart: unless-stopped
    secrets:
      - ferrowarden_admin_key
      - bw_master_password
    volumes:
      # TLS certificate and private key. Generate before first start.
      # See docs/setup.md Step 0 or scripts/dev-setup.ps1 / dev-setup.sh.
      - ./certs/server.crt:/run/certs/server.crt:ro
      - ./certs/server.key:/run/certs/server.key:ro
      # Persistent agent key store. Only SHA-256 hashes are written — plaintext
      # tokens are never stored on disk. Keys survive container restarts and
      # can be rotated via the admin API without shell access.
      - ferrowarden-keys:/data
    environment:
      FERROWARDEN_UNLOCK_MODE: "file"
      FERROWARDEN_UNLOCK_FILE: "/run/secrets/bw_master_password"
      FERROWARDEN_BW_SERVE_URL: "http://bw-serve:8087"
      FERROWARDEN_BIND_ADDR: "0.0.0.0:3000"
      # Admin key is read from Docker secret by the entrypoint script.
      FERROWARDEN_ADMIN_KEY_FILE: "/run/secrets/ferrowarden_admin_key"
      FERROWARDEN_TLS_ENABLED: "true"
      FERROWARDEN_TLS_CERT_FILE: "/run/certs/server.crt"
      FERROWARDEN_TLS_KEY_FILE: "/run/certs/server.key"
      # Persist agent keys across restarts (SHA-256 hashes only, never plaintext).
      FERROWARDEN_KEYS_FILE: "/data/agent_keys.json"
      # Log level. Valid values: trace, debug, info, warn, error.
      # Module-scoped: "ferrowarden=debug,tower_http=warn"
      # Changing this requires a container restart — intentional, see docs/logging.md.
      FERROWARDEN_LOG_LEVEL: "info"
      # Credentials are only sent to hosts listed in their vault item's URIs.
      # Leave this on; see docs/security.md before changing it.
      FERROWARDEN_ENFORCE_CREDENTIAL_HOSTS: "true"
      # The settings below are read from .env (see .env.example); empty means
      # ferrowarden's default.
      # Private/internal targets agents may reach (CIDRs, IPs, host names).
      FERROWARDEN_ALLOWED_TARGETS: "${FERROWARDEN_ALLOWED_TARGETS:-}"
      # Reverse proxies whose X-Forwarded-For is trusted for rate limiting.
      FERROWARDEN_TRUSTED_PROXIES: "${FERROWARDEN_TRUSTED_PROXIES:-}"
      # Optional hard-to-guess path prefix for the API (not /health).
      FERROWARDEN_API_PREFIX: "${FERROWARDEN_API_PREFIX:-}"
      # How often new/changed vault items are picked up (seconds).
      FERROWARDEN_REFRESH_INTERVAL_SECS: "${FERROWARDEN_REFRESH_INTERVAL_SECS:-}"
      # Agent endpoint rate limit per client IP (defaults 120/min, burst 20).
      FERROWARDEN_AGENT_RATE_LIMIT_PER_MINUTE: "${FERROWARDEN_AGENT_RATE_LIMIT_PER_MINUTE:-}"
      FERROWARDEN_AGENT_RATE_LIMIT_BURST: "${FERROWARDEN_AGENT_RATE_LIMIT_BURST:-}"
      # Admin endpoint rate limit per client IP (defaults 30/min, burst 5).
      FERROWARDEN_ADMIN_RATE_LIMIT_PER_MINUTE: "${FERROWARDEN_ADMIN_RATE_LIMIT_PER_MINUTE:-}"
      FERROWARDEN_ADMIN_RATE_LIMIT_BURST: "${FERROWARDEN_ADMIN_RATE_LIMIT_BURST:-}"
      # Security event stream (docs/events.md). Events go to stdout by default.
      # Uncomment to also write a rotating JSON-lines file (mount a volume at
      # that path to keep it) and/or forward to syslog. Defaults are unchanged
      # when these stay commented out.
      # FERROWARDEN_EVENTS__STDOUT: "true"
      # FERROWARDEN_EVENTS__FILE: "/data/events/events.jsonl"
      # FERROWARDEN_EVENTS__FILE_MAX_BYTES: "52428800"
      # FERROWARDEN_EVENTS__FILE_KEEP: "10"
      # FERROWARDEN_EVENTS__SYSLOG: "tls://wazuh.example.lan:6514"
      # FERROWARDEN_EVENTS__SYSLOG_FACILITY: "auth"
      # FERROWARDEN_EVENTS__SYSLOG_CA_FILE: "/run/certs/siem-ca.pem"
      # FERROWARDEN_EVENTS__BUFFER_SIZE: "1000"
      # FERROWARDEN_EVENTS__QUEUE_SIZE: "10000"
    networks:
      - vault-internal
      - agent-facing
    ports:
      # Bound to all interfaces so agents on other hosts can connect over TLS.
      # TLS is required (default) whenever this port is reachable over a network.
      # Change to 127.0.0.1:3000:3000 if the agent runs on the same host only.
      - "${FERROWARDEN_PUBLISH:-0.0.0.0}:${FERROWARDEN_PORT:-3000}:3000"
    depends_on:
      bw-serve:
        # Wait for bw serve to pass its healthcheck before starting ferrowarden.
        # Without this, ferrowarden's file-mode unlock races against bw serve init
        # and fails with "connection refused" on the first boot.
        condition: service_healthy
    healthcheck:
      # Uses the public /health endpoint (no auth required).
      # -k accepts the self-signed TLS cert for the local health check.
      test: ["CMD", "curl", "-f", "-k", "https://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Log rotation: keeps logs on disk bounded. Each log file caps at 50 MB;
    # up to 10 files are kept (500 MB max per service).
    # For Loki or Wazuh integration, see docs/logging.md.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"


# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Internal network for vault communication. Vaultwarden, bw-serve, and
  # ferrowarden can reach each other here. bw serve is only on this network,
  # so nothing outside Docker can reach it.
  vault-internal:
    driver: bridge
    internal: true

  # Network used only to publish the Vaultwarden web vault.
  vault-web:
    driver: bridge

  # Network ferrowarden uses to accept agent connections and make outbound
  # API calls to target services. Not internal.
  agent-facing:
    driver: bridge


# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  # Encrypted vault data. Back this up — it contains your credentials.
  vaultwarden-data:
  # bw CLI local vault cache. Persists across restarts so bw does not need
  # to re-sync on every container start.
  bw-data:
  # Agent key hashes. Allows keys to survive ferrowarden restarts.
  ferrowarden-keys:
  # Internal CA + Vaultwarden certificate (created by internal-certs).
  # Holds the CA private key — back it up with the other volumes or let it be
  # regenerated (bw serve picks up a new CA on restart).
  internal-pki:


# ── Secrets ──────────────────────────────────────────────────────────────────
# Create these files before running docker compose up.
# Each file contains only the secret value — no trailing newline.
#
# Linux/Mac:
#   mkdir -p secrets
#   echo -n "user.xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" > secrets/bw_client_id
#   echo -n "YourClientSecretHere"                       > secrets/bw_client_secret
#   echo -n "YourMasterPasswordHere"                     > secrets/bw_master_password
#   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 48 > secrets/ferrowarden_admin_key
#   chmod 600 secrets/*
#
# Windows (PowerShell):
#   New-Item -ItemType Directory -Force secrets
#   [IO.File]::WriteAllText("secrets\bw_client_id",           "user.xxxxxxxx-...", [Text.UTF8Encoding]::new($false))
#   [IO.File]::WriteAllText("secrets\bw_client_secret",       "YourClientSecretHere", [Text.UTF8Encoding]::new($false))
#   [IO.File]::WriteAllText("secrets\bw_master_password",     "YourMasterPasswordHere", [Text.UTF8Encoding]::new($false))
#   $k = -join ((65..90+97..122+48..57) | Get-Random -Count 48 | % { [char]$_ })
#   [IO.File]::WriteAllText("secrets\ferrowarden_admin_key",  $k, [Text.UTF8Encoding]::new($false))
secrets:
  bw_client_id:
    file: ./secrets/bw_client_id
  bw_client_secret:
    file: ./secrets/bw_client_secret
  bw_master_password:
    file: ./secrets/bw_master_password
  ferrowarden_admin_key:
    file: ./secrets/ferrowarden_admin_key
