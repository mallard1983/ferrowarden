# docker-compose.yml
#
# Ferrowarden production stack: Vaultwarden + Ferrowarden (native vault backend)
#
# BEFORE FIRST RUN:
#   1. Generate secrets (see the secrets section at the bottom).
#   2. Generate a TLS certificate (see docs/setup.md Step 0).
#   3. Optional: copy .env.example to .env and set where the Vaultwarden web
#      vault is published and the URL you reach it at.
#   4. Start Vaultwarden with signups enabled, just long enough to create
#      your account in the web vault (https://127.0.0.1:8443 by default):
#        VAULTWARDEN_SIGNUPS_ALLOWED=true docker compose up -d vaultwarden
#   5. In the web vault: Settings → Security → Keys → View API key. Write the
#      client_id and client_secret to secrets/bw_client_id and
#      secrets/bw_client_secret. Add Login items with URIs for your services.
#   6. Bring up the full stack (this also turns signups back off):
#        docker compose up -d
#
# The Vaultwarden web vault stays available afterwards: it is where you
# manage your passwords and the credentials agents use.
#
# See docs/setup.md for the complete step-by-step guide.

services:

  # ── Internal PKI (one-shot) ──────────────────────────────────────────────────
  # Creates a private CA and a certificate for "vaultwarden" in the
  # internal-pki volume. Ferrowarden refuses plain-HTTP vault URLs, so
  # Vaultwarden serves HTTPS on the internal network and ferrowarden trusts this
  # CA. Idempotent: re-issues the server cert only when missing or expiring,
  # and keeps an existing CA (including one an older release made with openssl).
  #
  # It runs `ferrowarden internal-certs`: the same static binary as the proxy,
  # from the same image (no Node, no shell, no openssl; docs/tls.md). Both
  # services name the same `image:` and `build:`, so one build serves both.
  internal-certs:
    image: ferrowarden:local
    build: .
    entrypoint: ["/app/ferrowarden", "internal-certs"]
    # Root, because the internal-pki volume (made by earlier releases too) is
    # root-owned with mode-0600 keys, and Vaultwarden runs as root. Root with no
    # capabilities: it writes only files it owns, so it needs neither
    # CAP_DAC_OVERRIDE nor CAP_CHOWN.
    user: "0"
    # Hardening: no network, a read-only root filesystem (it writes only the two
    # volumes), no capabilities, no privilege escalation.
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - internal-pki:/pki
      # Receives a copy of ca.crt only (never the key), for ferrowarden.
      - internal-ca-public:/ca-public
    environment:
      VW_HOSTNAME: "vaultwarden"
      # Extra names/IPs for the certificate, for browsing to the web vault
      # directly (e.g. "vault.lan,192.168.1.20"). Not needed behind a reverse
      # proxy that has its own certificate (e.g. Pangolin + Let's Encrypt).
      VW_EXTRA_SANS: "${VAULTWARDEN_CERT_SANS:-localhost,127.0.0.1}"
    restart: "no"

  # ── Vaultwarden ─────────────────────────────────────────────────────────────
  # Self-hosted Bitwarden-compatible server: your password manager. Its web
  # vault (and any Bitwarden app or browser extension) is where you store and
  # manage passwords, including the credentials agents use through
  # ferrowarden. Ferrowarden is the only other service that talks to it, over
  # the internal network.
  vaultwarden:
    # Pinned: the version Ferrowarden is tested against (CI also runs 1.36.0).
    # Upgrade deliberately and re-run the tests.
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    volumes:
      - vaultwarden-data:/data
      - internal-pki:/pki:ro
    depends_on:
      internal-certs:
        condition: service_completed_successfully
    # The only hardening applied here: Vaultwarden binds port 443 as root, so
    # it keeps its capabilities and a writable filesystem (docs/deployment-profiles.md).
    security_opt:
      - "no-new-privileges:true"
    environment:
      # The URL you reach the web vault at (e.g. https://vault.example.com
      # behind a reverse proxy). Used for links, passkeys/WebAuthn and emails.
      DOMAIN: "${VAULTWARDEN_DOMAIN:-https://127.0.0.1:8443}"
      # Off except while creating your first account
      # (VAULTWARDEN_SIGNUPS_ALLOWED=true docker compose up -d vaultwarden).
      # Anyone who can reach the web vault could otherwise register.
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      # HTTPS with the internal CA's certificate: Ferrowarden refuses plain
      # HTTP vault URLs, and the web vault needs a secure context.
      ROCKET_TLS: '{certs="/pki/vaultwarden.crt",key="/pki/vaultwarden.key"}'
      ROCKET_PORT: "443"
    networks:
      # vault-internal: reached by ferrowarden as https://vaultwarden.
      # vault-web: an ordinary bridge so the web vault can be published.
      - vault-internal
      - vault-web
    ports:
      # The web vault. Loopback by default; set VAULTWARDEN_PUBLISH=0.0.0.0
      # (in .env) for a reverse proxy or LAN clients — see docs/tls.md.
      - "${VAULTWARDEN_PUBLISH:-127.0.0.1}:${VAULTWARDEN_PORT:-8443}:443"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Ferrowarden ─────────────────────────────────────────────────────────────
  # The credential proxy. Agents send API calls here with {{vault:name}}
  # placeholders; ferrowarden substitutes real values, forwards the call,
  # and returns the scrubbed response. Credential values never reach the agent.
  ferrowarden:
    image: ferrowarden:local
    build: .
    restart: unless-stopped
    # Hardening (docs/deployment-profiles.md, "Standard"). The image is a
    # static binary on `scratch`: no shell, no curl. Read-only root filesystem,
    # no capabilities (port 3000 is unprivileged), no privilege escalation,
    # bounded processes and memory. Every path ferrowarden writes is on a
    # volume below, so no tmpfs is needed:
    #   /data/agent_keys.json (+ .tmp, same directory, for the atomic rename)
    #   /data/events/*        (only if the event file sink is enabled)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # The async runtime starts about one thread per CPU core plus a few more:
    # 256 leaves room on large hosts and still stops a fork bomb.
    pids_limit: 256
    # A few tens of MiB in normal use. The admin UI sign-in derives a key with
    # Argon2id using your Vaultwarden account's KDF memory (64 MiB by default,
    # up to 1 GiB if you raised it), so keep 1 GiB unless you know yours is low.
    mem_limit: 1g
    secrets:
      - ferrowarden_admin_key
      - bw_master_password
      - bw_client_id
      - bw_client_secret
      # Notifier tokens, as needed (see the FERROWARDEN_NOTIFY_* lines below):
      # - gotify_token
      # The metrics bearer token (see FERROWARDEN_METRICS_* below):
      # - metrics_token
    volumes:
      # TLS certificate and private key. Generate before first start.
      # See docs/setup.md Step 0 or scripts/dev-setup.ps1 / dev-setup.sh.
      - ./certs/server.crt:/run/certs/server.crt:ro
      - ./certs/server.key:/run/certs/server.key:ro
      # Persistent agent key store. Only SHA-256 hashes are written — plaintext
      # tokens are never stored on disk. Keys survive container restarts and
      # can be rotated via the admin API without shell access.
      - ferrowarden-keys:/data
      # The internal CA certificate (public part only: the CA private key stays
      # in the internal-pki volume, which ferrowarden must never mount). Lets
      # the admin UI verify Vaultwarden's certificate when it signs you in.
      - internal-ca-public:/ca-public:ro
    environment:
      FERROWARDEN_UNLOCK_MODE: "file"
      FERROWARDEN_UNLOCK_FILE: "/run/secrets/bw_master_password"
      # The vault backend is native (the default): Ferrowarden signs in to
      # Vaultwarden with your API key and decrypts only the one field a request
      # needs. No Bitwarden CLI, no Node, no decrypted values on the network
      # (docs/native-vault.md, docs/architecture.md).
      FERROWARDEN_VAULT__URL: "https://vaultwarden"
      # Trusts the internal CA that signed the Vaultwarden certificate. Also used
      # by the admin UI sign-in.
      FERROWARDEN_VAULT__CA_FILE: "/ca-public/ca.crt"
      # The API key, from secret files only (never values in this file).
      FERROWARDEN_VAULT_CLIENT_ID_FILE: "/run/secrets/bw_client_id"
      FERROWARDEN_VAULT_CLIENT_SECRET_FILE: "/run/secrets/bw_client_secret"
      # In file unlock mode one process holds both the API key and the master
      # password: read the trade-off in docs/security.md. For the hardened
      # setup, use FERROWARDEN_UNLOCK_MODE: "manual" and drop the
      # bw_master_password secret.
      # Items whose collection hides passwords from this account are left out by
      # default; "true" makes them usable by agents (docs/native-vault.md).
      # FERROWARDEN_VAULT__ALLOW_HIDDEN_PASSWORDS: "false"
      FERROWARDEN_BIND_ADDR: "0.0.0.0:3000"
      # The admin key is read from this Docker secret file by ferrowarden
      # itself; it is never placed in the process environment.
      FERROWARDEN_ADMIN_KEY_FILE: "/run/secrets/ferrowarden_admin_key"
      FERROWARDEN_TLS_ENABLED: "true"
      FERROWARDEN_TLS_CERT_FILE: "/run/certs/server.crt"
      FERROWARDEN_TLS_KEY_FILE: "/run/certs/server.key"
      # Persist agent keys across restarts (SHA-256 hashes only, never plaintext).
      FERROWARDEN_KEYS_FILE: "/data/agent_keys.json"
      # Log level. Valid values: trace, debug, info, warn, error.
      # Module-scoped: "ferrowarden=debug,tower_http=warn"
      # Changing this requires a container restart — intentional, see docs/logging.md.
      FERROWARDEN_LOG_LEVEL: "info"
      # Credentials are only sent to hosts listed in their vault item's URIs.
      # Leave this on; see docs/security.md before changing it.
      FERROWARDEN_ENFORCE_CREDENTIAL_HOSTS: "true"
      # The settings below are read from .env (see .env.example); empty means
      # ferrowarden's default.
      # Private/internal targets agents may reach (CIDRs, IPs, host names).
      FERROWARDEN_ALLOWED_TARGETS: "${FERROWARDEN_ALLOWED_TARGETS:-}"
      # Reverse proxies whose X-Forwarded-For is trusted for rate limiting.
      FERROWARDEN_TRUSTED_PROXIES: "${FERROWARDEN_TRUSTED_PROXIES:-}"
      # Optional hard-to-guess path prefix for the API (not /health).
      FERROWARDEN_API_PREFIX: "${FERROWARDEN_API_PREFIX:-}"
      # How often new/changed vault items are picked up (seconds).
      FERROWARDEN_REFRESH_INTERVAL_SECS: "${FERROWARDEN_REFRESH_INTERVAL_SECS:-}"
      # Agent endpoint rate limit per client IP (defaults 120/min, burst 20).
      FERROWARDEN_AGENT_RATE_LIMIT_PER_MINUTE: "${FERROWARDEN_AGENT_RATE_LIMIT_PER_MINUTE:-}"
      FERROWARDEN_AGENT_RATE_LIMIT_BURST: "${FERROWARDEN_AGENT_RATE_LIMIT_BURST:-}"
      # Admin endpoint rate limit per client IP (defaults 30/min, burst 5).
      FERROWARDEN_ADMIN_RATE_LIMIT_PER_MINUTE: "${FERROWARDEN_ADMIN_RATE_LIMIT_PER_MINUTE:-}"
      FERROWARDEN_ADMIN_RATE_LIMIT_BURST: "${FERROWARDEN_ADMIN_RATE_LIMIT_BURST:-}"
      # Security event stream (docs/events.md). Events go to stdout by default.
      # Uncomment to also write a rotating JSON-lines file (mount a volume at
      # that path to keep it) and/or forward to syslog. Defaults are unchanged
      # when these stay commented out.
      # FERROWARDEN_EVENTS__STDOUT: "true"
      # FERROWARDEN_EVENTS__FILE: "/data/events/events.jsonl"
      # FERROWARDEN_EVENTS__FILE_MAX_BYTES: "52428800"
      # FERROWARDEN_EVENTS__FILE_KEEP: "10"
      # FERROWARDEN_EVENTS__SYSLOG: "tls://wazuh.example.lan:6514"
      # FERROWARDEN_EVENTS__SYSLOG_FACILITY: "auth"
      # FERROWARDEN_EVENTS__SYSLOG_CA_FILE: "/run/certs/siem-ca.pem"
      # FERROWARDEN_EVENTS__BUFFER_SIZE: "1000"
      # FERROWARDEN_EVENTS__QUEUE_SIZE: "10000"
      # Push notifications (docs/notifications.md): off unless a URL is set.
      # Tokens come only from secret files (declare them under `secrets:` below
      # and in this service's `secrets:` list), never from this file.
      # FERROWARDEN_NOTIFY__GOTIFY_URL: "https://gotify.example.com"
      # FERROWARDEN_NOTIFY_GOTIFY_TOKEN_FILE: "/run/secrets/gotify_token"
      # FERROWARDEN_NOTIFY__NTFY_URL: "https://ntfy.example.com/ferrowarden"
      # FERROWARDEN_NOTIFY_NTFY_TOKEN_FILE: "/run/secrets/ntfy_token"      # optional
      # FERROWARDEN_NOTIFY__WEBHOOK_URL: "https://hooks.example.com/ferrowarden"
      # FERROWARDEN_NOTIFY_WEBHOOK_TOKEN_FILE: "/run/secrets/webhook_token"  # optional
      # FERROWARDEN_NOTIFY__EVENTS: "blocked,auth_failure,vault,system,approval"      # add admin for key changes
      # FERROWARDEN_NOTIFY__MIN_INTERVAL_SECS: "60"
      # FERROWARDEN_NOTIFY__MAX_PER_HOUR: "60"
      # Prometheus metrics (docs/metrics.md): off unless a bind address is set.
      # A separate listener that serves GET /metrics only, behind a bearer token
      # from a secret file (declare `metrics_token` under `secrets:` below and in
      # this service's `secrets:` list). A non-loopback bind with no token is
      # refused. The token is sent in clear text unless FERROWARDEN_TLS_ENABLED
      # is true (the listener then uses the same certificate), so publish the
      # port only on a network you trust.
      # FERROWARDEN_METRICS__BIND: "0.0.0.0:9095"
      # FERROWARDEN_METRICS_TOKEN_FILE: "/run/secrets/metrics_token"
      # FERROWARDEN_METRICS__CREDENTIAL_LABELS: "false"   # true: vault item names become labels
      # Admin web UI (docs/admin-ui.md): off unless FERROWARDEN_UI__BIND is set.
      # It accepts the vault master password, so it only serves its sign-in form
      # over HTTPS: put a TLS reverse proxy in front and list it in
      # FERROWARDEN_TRUSTED_PROXIES, or enable ferrowarden's own TLS.
      # FERROWARDEN_UI__BIND: "0.0.0.0:3001"
      # FERROWARDEN_UI__SESSION_IDLE_MINUTES: "15"
      # FERROWARDEN_UI__SESSION_MAX_HOURS: "8"
      # The address you open the UI at; approval prompts link to <it>/approvals/<id>.
      # FERROWARDEN_UI__PUBLIC_URL: "https://ferrowarden-admin.example.com"
      # Local testing only (plain-HTTP sign-in form):
      # FERROWARDEN_UI__INSECURE_HTTP: "true"
    networks:
      - vault-internal
      - agent-facing
    ports:
      # Bound to all interfaces so agents on other hosts can connect over TLS.
      # TLS is required (default) whenever this port is reachable over a network.
      # Change to 127.0.0.1:3000:3000 if the agent runs on the same host only.
      - "${FERROWARDEN_PUBLISH:-0.0.0.0}:${FERROWARDEN_PORT:-3000}:3000"
      # Admin web UI port (when FERROWARDEN_UI__BIND is set). Loopback only;
      # reach it through your TLS reverse proxy.
      # - "127.0.0.1:3001:3001"
      # Metrics port (when FERROWARDEN_METRICS__BIND is set). Prefer an internal
      # network: put Prometheus on a Docker network it shares with this service
      # and leave the port unpublished, or publish it on loopback or a
      # management VLAN only.
      # - "127.0.0.1:9095:9095"
    depends_on:
      internal-certs:
        # The CA certificate copy exists once the one-shot has finished.
        condition: service_completed_successfully
      vaultwarden:
        # Ferrowarden signs in and unlocks at start. If Vaultwarden is not ready
        # yet, the start fails and the restart policy tries again.
        condition: service_started
    healthcheck:
      # The image has no curl: the binary checks itself. It requests the public
      # /health endpoint (no auth) on the port it listens on, over TLS when TLS
      # is on, and verifies the server's certificate against the configured
      # tls_cert_file, so nothing is skipped for a self-signed certificate.
      test: ["CMD", "/app/ferrowarden", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Log rotation: keeps logs on disk bounded. Each log file caps at 50 MB;
    # up to 10 files are kept (500 MB max per service).
    # For Loki or Wazuh integration, see docs/logging.md.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Internal network for vault communication. Vaultwarden and ferrowarden can
  # reach each other here; nothing outside Docker can reach it.
  vault-internal:
    driver: bridge
    internal: true

  # Network used only to publish the Vaultwarden web vault.
  vault-web:
    driver: bridge

  # Network ferrowarden uses to accept agent connections and make outbound
  # API calls to target services. Not internal.
  agent-facing:
    driver: bridge


# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  # Encrypted vault data. Back this up — it contains your credentials.
  vaultwarden-data:
  # Agent key hashes. Allows keys to survive ferrowarden restarts.
  ferrowarden-keys:
  # Internal CA + Vaultwarden certificate (created by internal-certs).
  # Holds the CA private key: back it up with the other volumes or let it be
  # regenerated (Ferrowarden picks up the new CA on restart).
  internal-pki:
  # Only the CA certificate (ca.crt), copied from internal-pki by internal-certs.
  # This is what ferrowarden mounts, so it never sees the CA private key.
  internal-ca-public:


# ── Secrets ──────────────────────────────────────────────────────────────────
# Create these files before running docker compose up.
# Each file contains only the secret value — no trailing newline.
#
# Linux/Mac:
#   mkdir -p secrets
#   echo -n "user.xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" > secrets/bw_client_id
#   echo -n "YourClientSecretHere"                       > secrets/bw_client_secret
#   echo -n "YourMasterPasswordHere"                     > secrets/bw_master_password
#   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 48 > secrets/ferrowarden_admin_key
#   chmod 600 secrets/*
#
# Windows (PowerShell):
#   New-Item -ItemType Directory -Force secrets
#   [IO.File]::WriteAllText("secrets\bw_client_id",           "user.xxxxxxxx-...", [Text.UTF8Encoding]::new($false))
#   [IO.File]::WriteAllText("secrets\bw_client_secret",       "YourClientSecretHere", [Text.UTF8Encoding]::new($false))
#   [IO.File]::WriteAllText("secrets\bw_master_password",     "YourMasterPasswordHere", [Text.UTF8Encoding]::new($false))
#   $k = -join ((65..90+97..122+48..57) | Get-Random -Count 48 | % { [char]$_ })
#   [IO.File]::WriteAllText("secrets\ferrowarden_admin_key",  $k, [Text.UTF8Encoding]::new($false))
secrets:
  bw_client_id:
    file: ./secrets/bw_client_id
  bw_client_secret:
    file: ./secrets/bw_client_secret
  bw_master_password:
    file: ./secrets/bw_master_password
  ferrowarden_admin_key:
    file: ./secrets/ferrowarden_admin_key
  # Metrics bearer token (docs/metrics.md), only if you enable the metrics listener.
  # metrics_token:
  #   file: ./secrets/metrics_token
  # Notifier tokens (docs/notifications.md): one file each, only if you use them.
  # gotify_token:
  #   file: ./secrets/gotify_token
